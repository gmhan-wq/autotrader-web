  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --ink: #f0f3ff; --muted: #b9c2e0; --line: rgba(190, 200, 255, 0.16);
  --accent: #b8adff; --accent-ink: #15123a; --ice: #8fd0ff; --soft: rgba(184, 173, 255, 0.16);

function viewOrders() {

function ordBadges(s, d, g) {

function renderLogin() {

      <div id="l-pw-hint" class="small muted" hidden>새 비밀번호는 ${PW_MIN}자 이상 (영문·숫자를 섞어 주세요)</div>
      <label id="l-name-wrap" hidden>이름 (가족에게 보일 이름)<input type="text" id="l-name"></label>
      ${TURNSTILE_SITE_KEY ? `<div id="l-captcha"></div><div id="l-cap-hint" class="small muted"></div>` : ""}
      <div class="row"><button class="btn primary" id="l-go">로그인</button><button class="btn" type="button" id="l-mode">처음이면 가입</button>
        <button class="btn ghost" type="button" id="l-reset">비밀번호를 잊었어요</button></div>
    </form></div>`;
  let signup = false;
  mountTurnstile();
  document.getElementById("l-mode").onclick = () => { signup = !signup;
    document.getElementById("l-name-wrap").hidden = !signup;
    document.getElementById("l-pw-hint").hidden = !signup;
    const pw = document.getElementById("l-pw"); pw.minLength = signup ? PW_MIN : 8; pw.autocomplete = signup ? "new-password" : "current-password";
    document.getElementById("l-go").textContent = signup ? "가입" : "로그인";
    document.getElementById("l-mode").textContent = signup ? "이미 가입했으면 로그인" : "처음이면 가입"; };
  document.getElementById("l-reset").onclick = async () => {
    const email = document.getElementById("l-email").value.trim();
    if (!email) { S.msg = { bad: true, text: "이메일 칸을 먼저 채워 주세요" }; return render(); }
    if (!captchaReady()) return;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname, ...captchaOpts() });
    S.msg = error ? { bad: true, text: ko(error.message) } : { text: "비밀번호를 다시 정하는 링크를 메일로 보냈습니다." }; render(); };
  document.getElementById("f-login").onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById("l-email").value.trim(), password = document.getElementById("l-pw").value;
    if (signup && password.length < PW_MIN) { S.msg = { bad: true, text: `비밀번호는 ${PW_MIN}자 이상으로 정해 주세요` }; return render(); }
    if (!captchaReady()) return;
    if (signup) {
      const { error } = await sb.auth.signUp({ email, password, options: { ...captchaOpts(), data: { display_name: document.getElementById("l-name").value.trim() || email.split("@")[0] } } });
      S.msg = error ? { bad: true, text: "가입 실패: " + ko(error.message) } : { text: "가입했습니다. 메일함의 확인 링크를 누른 뒤 로그인하세요." };
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password, options: captchaOpts() });
      S.msg = error ? { bad: true, text: "로그인 실패: " + ko(error.message) } : null;
    }
    render();
  };
}

  document.querySelectorAll(".cline").forEach((c) => c.onchange = () => { S.cfSel = S.cfSel || {}; S.cfSel[c.dataset.l] = c.checked; });
  document.querySelectorAll("details[data-calopen]").forEach((el) => el.ontoggle = () => { (S.calOpen = S.calOpen || {})[el.dataset.calopen] = el.open; });
  document.querySelectorAll("details[data-foldopen]").forEach((el) => el.ontoggle = () => { (S.foldOpen = S.foldOpen || {})[el.dataset.foldopen] = el.open; });
  document.querySelectorAll("[data-confirm-test]").forEach((b) => b.onclick = () => { S.confirmPlan = { acc: b.dataset.confirmTest, test: true, lines: [] }; render(); });
  document.querySelectorAll("[data-confirm-cancel]").forEach((b) => b.onclick = () => { S.confirmPlan = null; render(); });
  document.querySelectorAll("[data-confirm-go]").forEach((b) => b.onclick = () => sendOrders(S.confirmPlan, (document.getElementById("cf-pass") || {}).value));
  document.querySelectorAll("[data-cycle-same]").forEach((b) => b.onclick = () => send("set_strategy", { id: b.dataset.cycleSame, cycle: "same" }));
  if (S.snap) bindAutoWindow();
  document.querySelectorAll("[data-stop]").forEach((b) => b.onclick = () => { S.stopAsk = null; send("set_strategy", { id: b.dataset.stop, active: false }); });
  document.querySelectorAll("[data-privacy]").forEach((b) => b.onclick = () => b.dataset.privacy === "1"
    ? send("add_strategy", { kind: "privacy", id: "privacy" }) : send("set_strategy", { id: "privacy", active: false }));
  const fa = document.getElementById("f-acc");
  if (fa) fa.onsubmit = (e) => { e.preventDefault();
    send("add_account", { id: document.getElementById("a-id").value.trim().toLowerCase(), name: document.getElementById("a-name").value.trim() }); };
  const prefill = () => { const sym = document.getElementById("s-symbol"), ac = document.getElementById("s-account"), q = document.getElementById("s-qty");
    if (!sym || !ac || !q || !S.snap) return; const r = ((S.snap.detail || {}).real_orders || {})[ac.value];
    const n = r && r.positions ? r.positions[sym.value] : undefined;
    if (n !== undefined) { q.value = (S.newKind === "vr") ? Math.round(n / (Number((document.getElementById("s-mult") || {}).value) || 1)) : n;
      const h = document.getElementById("s-hint"); if (h) h.textContent = `메리츠 보유 ${n}주를 넣었습니다 (확인 후 고치세요)`; } };
  document.querySelectorAll("[data-vrmode]").forEach((b) => b.onclick = () => vrModeApply(b.dataset.vrmode));
  if (document.getElementById("s-limit")) vrModeApply(S.vrMode || "accum");
  ["s-symbol", "s-account", "s-mult"].forEach((id) => { const el = document.getElementById(id); if (el) el.addEventListener("change", prefill); });
  prefill();
  const fs = document.getElementById("f-str");
  if (fs) fs.onsubmit = (e) => { e.preventDefault();
    const kind = (S.newKind === "v4" ? "sheet" : S.newKind) || "sheet", v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
    const isNew = kind === "sheet" && S.buyMode === "new", fk = isNew ? "sheet_new" : kind;
    const p = { kind, id: v("s-id").toLowerCase(), symbol: v("s-symbol"), account: v("s-account"), mock_only: !!S.addMock };
    for (const [k] of KIND_FIELDS[fk]) { const x = v("s-" + k); if (x !== "") p[k] = (k === "rules" || k === "checks") ? x : x.replace(/,/g, ""); }
    if (kind === "sheet") p.start = isNew ? "new" : "cont";
    if (kind === "vr") { p.vr_mode = S.vrMode || "accum"; if (p.vr_mode === "hold") p.contribution = "0"; }   // 작업 ㊲ A
    if (kind === "ph01") {
      const f = phForm();
      if (f.err) { S.msg = { bad: true, text: "매수 구간: " + f.err }; render(); return; }
      p.bands = f.bands.map(([a, m]) => `${a}:${m}`).join(",");
      p.name = v("s-name") || `PH01 · ${p.symbol} · ${ACC_NAME[p.account] || p.account}`;
    }
    if (kind === "dynamic") {
      const f = dynForm(), ser = (a) => [...a].sort((x, y) => x[0] - y[0]).map(([d, w]) => `${d}:${w}`).join(",");
      const dup = (a) => new Set(a.map((x) => x[0])).size !== a.length;
      if (dup(f.rules) || dup(f.stops)) { S.msg = { bad: true, text: "같은 하락% 단계가 두 개 있습니다 — 다이얼을 다르게 맞춰 주세요" }; render(); return; }
      Object.assign(p, { rules: ser(f.rules), stops: ser(f.stops), tp: String(f.tp), tp_sell: String(f.tpSell) });
      if (!f.stops.length) p.stops = "";
    }
    const ss = S.sessSel.add, serr = ss ? sessCheck(ss.sel, ss.fam) : "";       // 운용 장 (ADR 0053)
    if (serr) { S.msg = { bad: true, text: serr }; render(); return; }
    if (ss) p.sessions = sessClean(ss.sel);
    send("add_strategy", p); };
  const fg = document.getElementById("f-grant");
  if (fg) fg.onsubmit = async (e) => { e.preventDefault();
    const rel = document.getElementById("g-rel").value;
    const r = await sb.rpc("grant_access", { p_viewer_email: document.getElementById("g-email").value.trim(), p_level: "detail",
      p_relation: rel, p_days: rel === "family" ? null : 30 });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "추가했습니다. 상대가 '볼 수 있는 사람'에서 봅니다." };
    await loadFamily(); render(); };
  const fr = document.getElementById("f-req");
  if (fr) fr.onsubmit = async (e) => { e.preventDefault();
    const r = await sb.rpc("request_access", { p_owner_email: document.getElementById("r-email").value.trim(), p_level: "summary",
      p_note: document.getElementById("r-note").value.trim() || null });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "요청했습니다. 상대가 허락하면 '볼 수 있는 사람'에 나옵니다." };
    await loadFamily(); render(); };
  document.querySelectorAll("[data-decide]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("decide_access", { p_grant_id: Number(b.dataset.decide), p_approve: b.dataset.ok === "1", p_days: 30, p_level: null });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: b.dataset.ok === "1" ? "30일 동안 요약을 볼 수 있게 했습니다." : "거절했습니다." };
    await loadFamily(); render(); });
  document.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("revoke_access", { p_viewer_email: b.dataset.revoke });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "회수했습니다." };
    await loadFamily(); render(); });
}

// ── 시작 ──
// 11/07: '불러오는 중'에서 멈추지 않게 — 응답이 늦으면 시간 제한 + 안내 + 다시 시도
const withTimeout = (pr, ms, what) => Promise.race([pr, new Promise((_, bad) => setTimeout(() => bad(new Error(what + " 응답이 " + Math.round(ms / 1000) + "초 넘게 없음")), ms))]);
function loadingStuck(reason) {
  const el = document.getElementById("loading"); if (!el) return;
  el.innerHTML = `<div><b>불러오기가 오래 걸립니다</b></div>
    <div class="small muted">${esc(reason || "서버(Supabase) 응답을 기다리는 중")}${S.stage ? " · 단계: " + esc(S.stage) : ""}${S.jsErrors.length ? "<br>오류: " + esc(S.jsErrors.join(" / ")) : ""}</div>
    <div class="small muted">인터넷 연결을 확인하고 다시 시도해 주세요. 계속되면 이 화면을 Claude 에게 보내 주세요.</div>
    <div class="row"><button class="btn primary" onclick="location.reload()">다시 시도</button></div>`;
}
setTimeout(() => loadingStuck(), 35000);
async function onSession(session) {
  try { await onSessionInner(session); }
  catch (e) { if (document.getElementById("loading")) loadingStuck(String(e.message || e)); else { S.msg = { bad: true, text: "불러오지 못했습니다: " + (e.message || e) }; render(); } }
}
async function onSessionInner(session) {
  S.user = session ? session.user : null;
  if (S.user) {
    S.stage = "회원 정보";
    const p = await withTimeout(sb.from("profiles").select("display_name,status,role").eq("user_id", S.user.id).limit(1), 12000, "회원 정보");
    const me = (p.data && p.data[0]) || {};
    S.name = me.display_name || S.user.email.split("@")[0];
    S.status = me.status || "approved";            // 회원 승인 기능 이전 데이터베이스면 승인으로 본다
    S.admin = me.role === "admin";
    if (S.status !== "approved") return renderPending();
    await withTimeout(loadFlags(), 8000, "설정").catch(() => {});
    await withTimeout(loadOps(), 8000, "공동 운영").catch(() => {});
    S.stage = "현황";
    await withTimeout(refresh(), 33000, "현황");
  } else render();
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") { S.recovery = true; S.user = session && session.user; return renderRecovery(); } if ((session && session.user.id) !== (S.user && S.user.id)) onSession(session); });
S.stage = "로그인 확인";
withTimeout(sb.auth.getSession(), 10000, "로그인 확인").then(({ data }) => onSession(data.session)).catch((e) => {
  // 로그인 확인이 멈추면: 저장된 로그인 정보를 지우고 로그인 화면으로 (다시 로그인하면 됨)
  try { Object.keys(localStorage).filter((k) => k.startsWith("sb-") && k.endsWith("-auth-token")).forEach((k) => localStorage.removeItem(k)); } catch (x) {}
  S.user = null; S.msg = { bad: true, text: "로그인 확인이 멈춰 저장된 로그인을 지웠습니다 — 다시 로그인해 주세요 (" + (e.message || e) + ")" }; render();
});
setInterval(() => { if (document.visibilityState === "visible") refresh(true); }, 30000);
// 실시간 시세: 화면을 보고 있고 장 시간이면 5초마다 가져와 시세 줄만 바꾼다 (화면 전체를 다시 그리지 않음).
// 30초마다 '보고 있음'을 알려야 관리자 노트북이 5초 시세를 올린다 (아무도 안 보면 메리츠를 부르지 않음).
let liveTouched = 0;
setInterval(async () => {
  if (document.visibilityState !== "visible" || !S.user || !S.snap || S.status !== "approved") return;
  const m = S.snap.summary.market; if (m && m.code === "closed") return;
  if (!["home", "orders"].includes(S.tab)) return;
  try {
    if (Date.now() - liveTouched > 30000) { liveTouched = Date.now(); await sb.rpc("touch_live"); }
    const r = await sb.from("live_quotes").select("quotes,at").eq("id", "global").limit(1);
    const row = r.data && r.data[0]; if (!row || !row.at || (S.live && S.live.at === row.at)) return;
    S.livePrev = S.live ? S.live.quotes : null; S.live = row;
    const el = document.getElementById("mkt"); if (el) el.outerHTML = marketStrip(S.snap.summary);
  } catch (e) {}
}, 5000);
let _lastMode = null;
let _lastAutoPhone = null;   // 작업 ㉟: 폭이 768 을 넘나들면(회전 등) auto 화면을 다시 그림
window.addEventListener("resize", () => { const m = layout(), ap = autoPhone(); if (m !== _lastMode || ap !== _lastAutoPhone) { _lastMode = m; _lastAutoPhone = ap; if (S.user) render(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(true); });
</script>
</body>
</html>
