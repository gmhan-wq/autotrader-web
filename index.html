<html lang="ko">

<style>
/* 레이아웃: 계정 줄 + 반투명 탭, 아래 유리 카드 세로 쌓기 (폰 우선, 넓으면 가운데 680px).
   배경: 아이스 블루·라벤더 빛 번짐 위에 반투명(유리) 카드. 글자는 카드 위에서 4.5:1 이상 대비 */
:root {
  --bg: #e9effa;                         /* 바탕 */
  --glow-ice: #9fd3f5; --glow-lav: #c7b8f5; --glow-mix: #b6c9f7;
  --glass: rgba(255, 255, 255, 0.62);    /* 카드 유리 */
  --glass-strong: rgba(255, 255, 255, 0.82);
  --glass-edge: rgba(255, 255, 255, 0.85);
  --shadow: 0 8px 28px rgba(60, 72, 140, 0.14);
  --ink: #13213a; --muted: #44506b; --line: rgba(80, 96, 150, 0.18);
  --accent: #5b4bc9; --accent-ink: #ffffff;  /* 라벤더 */
  --ice: #1f78b4;                            /* 아이스 블루 (보조) */
  --soft: rgba(199, 184, 245, 0.28);
  --buy: #c11d3d; --sell: #1b5bc9; --ok: #17794a; --warn: #9a5a00; --bad: #b3261e;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1124; --glow-ice: #1d5f8f; --glow-lav: #4b3a96; --glow-mix: #26346f;
  --glass: rgba(24, 31, 62, 0.62); --glass-strong: rgba(30, 38, 74, 0.86); --glass-edge: rgba(190, 200, 255, 0.16);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --ink: #f0f3ff; --muted: #b9c2e0; --line: rgba(190, 200, 255, 0.16);
  --accent: #b8adff; --accent-ink: #15123a; --ice: #8fd0ff; --soft: rgba(184, 173, 255, 0.16);
  --buy: #ff8fa2; --sell: #8cb9ff; --ok: #74d9a2; --warn: #f5c062; --bad: #ff958a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1124; --glow-ice: #1d5f8f; --glow-lav: #4b3a96; --glow-mix: #26346f;
  --glass: rgba(24, 31, 62, 0.62); --glass-strong: rgba(30, 38, 74, 0.86); --glass-edge: rgba(190, 200, 255, 0.16);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --ink: #f0f3ff; --muted: #b9c2e0; --line: rgba(190, 200, 255, 0.16);
  --accent: #b8adff; --accent-ink: #15123a; --ice: #8fd0ff; --soft: rgba(184, 173, 255, 0.16);
  --buy: #ff8fa2; --sell: #8cb9ff; --ok: #74d9a2; --warn: #f5c062; --bad: #ff958a; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; min-height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); position: relative }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(42rem 30rem at 8% -6%, var(--glow-ice), transparent 62%),
    radial-gradient(38rem 32rem at 105% 18%, var(--glow-lav), transparent 60%),
    radial-gradient(40rem 30rem at 30% 110%, var(--glow-mix), transparent 62%),
    var(--bg) }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 44px;
  display: flex; flex-direction: column; gap: 14px }
h1 { font-size: 21px; margin: 0; letter-spacing: -0.015em; font-weight: 700 }
h2 { font-size: 15.5px; margin: 0; text-wrap: balance; font-weight: 700 }
.num, td.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) } .small { font-size: 13px }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.top .who { display: flex; flex-direction: column; min-width: 0 }
.glass, .card, .tabs {
  background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%) }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .card, .tabs { background: var(--glass-strong) } }
.tabs { display: flex; gap: 4px; padding: 5px; border-radius: 16px; position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 5 }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 500 13.5px var(--sans);
  padding: 9px 2px; border-radius: 11px; cursor: pointer; position: relative }
.tabs button[aria-selected="true"] { background: var(--glass-strong); color: var(--ink); font-weight: 700;
  box-shadow: 0 2px 8px rgba(70, 80, 150, 0.16), inset 0 0 0 1px var(--glass-edge) }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px;
  background: var(--buy); color: #fff; font-size: 12px; line-height: 18px }
#view { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.grow { flex: 1 1 auto }
.btn.ghost { background: transparent; box-shadow: none }
.live i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px }
/* PC */
body[data-layout="pc"] .wrap { max-width: 1360px }
header.pc-top.card { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 16px; border-radius: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 6 }
.brand { font-size: 17px; letter-spacing: -0.01em }
.pc-body { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start }
nav.pc-nav.card { gap: 2px; padding: 10px; position: sticky; top: 84px }
.nav-h { font-size: 12px; color: var(--muted); padding: 12px 10px 4px }
.nav-i { display: flex; align-items: center; gap: 8px; text-align: left; font: 500 14px var(--sans); color: var(--ink); background: transparent; border: 0;
  padding: 9px 10px; border-radius: 10px; cursor: pointer; min-height: 40px }
.nav-i:hover { background: var(--soft) } .nav-i[aria-current="true"] { background: var(--glass-strong); font-weight: 700; box-shadow: inset 0 0 0 1px var(--glass-edge) }
.pc-main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
/* 폰 */
body[data-layout="phone"] .wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) }
.ph-top { gap: 8px } .ph-top h1 { font-size: 19px }
.ph-total { display: flex; flex-direction: column; gap: 2px } .ph-total b { font-size: 30px; font-weight: 600 }
.banner { display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid currentColor;
  background: var(--glass-strong); color: var(--warn); font: 700 14px var(--sans); cursor: pointer }
.ph-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
  background: var(--glass-strong); border-top: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px) }
.ph-nav button { min-height: 52px; border: 0; background: transparent; color: var(--muted); font: 500 13px var(--sans); border-radius: 12px; cursor: pointer }
.ph-nav button[aria-current="true"] { color: var(--ink); font-weight: 700; background: var(--soft) }
.list { gap: 0; padding: 12px 14px } .list > .row { padding-bottom: 8px }
.lrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: transparent;
  color: var(--ink); font: inherit; text-align: left; cursor: pointer; min-height: 56px }
.lmain { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0 } .lval { font-weight: 600; font-size: 14px }
.oline { display: grid; grid-template-columns: 36px 52px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line) }
.member { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line) }
.oline.off { opacity: .5 } .oline.off b { text-decoration: line-through }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px }
.kpi { gap: 4px } .kpi b { font-size: 21px; font-weight: 600 } .kpi b.warnc { color: var(--warn) }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px }
.scard { text-align: left; font: inherit; color: var(--ink); cursor: pointer }
.scard:hover { border-color: var(--accent) }
.sym { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 7px; background: var(--soft) }
.kv2 { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 13px } .kv2 .num { text-align: right }
.chart { width: 100%; height: auto; display: block }
.grid-2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px }
@media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr } }
tr.offrow td { opacity: .45 } tr.offrow td.n { text-decoration: line-through }
.card { border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.card > h2:first-child, .card > .row:first-child h2 { color: var(--ink) }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.between { justify-content: space-between }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  white-space: nowrap; background: var(--glass-strong) }
.chip.ok { color: var(--ok); border-color: currentColor } .chip.warn { color: var(--warn); border-color: currentColor }
.chip.bad { color: var(--bad); border-color: currentColor }
.scroll { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 4px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 7px 4px; border-bottom: 1px solid var(--line); white-space: nowrap }
td.n, th.n { text-align: right }
tr:last-child td { border-bottom: 0 }
.buy { color: var(--buy); font-weight: 500 } .sell { color: var(--sell); font-weight: 500 }
.line { display: grid; grid-template-columns: 26px 44px 58px 1fr auto; gap: 6px; align-items: center;
  padding: 8px 4px; border-bottom: 1px solid var(--line) }
.line:last-child { border-bottom: 0 }
.line.off { opacity: .5 } .line.off .px { text-decoration: line-through }
.line input { width: 20px; height: 20px; accent-color: var(--accent) }
button.btn { border: 1px solid var(--glass-edge); background: var(--glass-strong); color: var(--ink); font: 500 14px var(--sans);
  padding: 9px 15px; border-radius: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(70, 80, 150, 0.10) }
button.btn:hover { border-color: var(--accent) }
button.btn.primary { background: linear-gradient(135deg, var(--accent), var(--ice)); color: #ffffff; border-color: transparent;
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.18) }
:root[data-theme="dark"] button.btn.primary { color: var(--accent-ink); text-shadow: none }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.btn.primary { color: var(--accent-ink); text-shadow: none } }
button.btn.danger { color: var(--bad) }
button.btn:disabled { opacity: .5; cursor: default }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input[type=email], input[type=password], input[type=text], input[type=number], input[type=date], select { width: 100%; font: 15px var(--sans); padding: 10px 12px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); color: var(--ink) }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted) }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.strat { display: flex; flex-direction: column; gap: 4px; padding: 9px 0; border-bottom: 1px solid var(--line) }
.strat:last-child { border-bottom: 0 }
.sw input { width: 20px; height: 20px; accent-color: var(--accent) }
.cmd { padding: 7px 0; border-bottom: 1px solid var(--line) } .cmd:last-child { border-bottom: 0 }
.notice { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px }
.notice:last-child { border-bottom: 0 }
.msg { font-size: 13px; padding: 9px 12px; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--glass-edge) }
.msg.bad { color: var(--bad) }
.msg.warn-note { color: var(--warn); border-color: currentColor }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0 }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; border-radius: 14px; background: var(--soft) }
.login { max-width: 380px; margin: 8vh auto 0; width: 100% }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px }
.kv div { display: flex; flex-direction: column; min-width: 0; padding: 8px 10px; border-radius: 12px; background: var(--soft) }
.kv b { font: 500 15px var(--mono) }
summary { cursor: pointer; color: var(--ice) }
@media (prefers-reduced-motion: no-preference) { .tabs button, button.btn { transition: background .15s, border-color .15s } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card login" id="loading"><div class="muted">불러오는 중…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
// 공개용 값(웹 화면에 넣도록 만든 키). 데이터는 로그인 + 행 단위 권한(RLS)으로 지켜진다.
const SUPABASE_URL = "https://yusvlbnlrfawmoqqswso.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1c3ZsYm5scmZhd21vcXFzd3NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDgwNDAsImV4cCI6MjEwODg4NDA0MH0.Vu_HfzTH_VmnkD76rlbzlbzAShHBI4PI4MTO7S3_Zno";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $app = document.getElementById("app");
const S = { user: null, name: "", tab: "home", snap: null, cmds: [], owners: [], grants: [], viewing: null,
            viewSnap: null, confirm: null, msg: null, busy: false };
try { S.tab = localStorage.getItem("tab") || "home"; } catch (e) {}

const esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (x, d = 2) => (x === null || x === undefined || x === "") ? "-" :
  Number(x).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
const sideKo = (s) => s === "BUY" ? "매수" : s === "SELL" ? "매도" : esc(s);
const sideCls = (s) => s === "BUY" ? "buy" : "sell";
const ACC_NAME = { main: "A계좌", b: "B계좌", c: "C계좌" };
const when = (iso) => { if (!iso) return "-"; const d = new Date(iso);
  return d.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); };

// ── 데이터 ──
async function loadMine() {
  const { data } = await sb.from("status_snapshots").select("taken_at,host,summary,detail")
    .eq("user_id", S.user.id).order("taken_at", { ascending: false }).limit(1);
  S.snap = data && data[0] || null;
  const c = await sb.from("web_commands").select("id,command,payload,status,result,created_at")
    .order("id", { ascending: false }).limit(8);
  S.cmds = c.data || [];
}
async function loadFamily() {
  const o = await sb.rpc("viewable_owners"); S.owners = (o.data || []).filter((x) => x.owner_id !== S.user.id);
  const g = await sb.rpc("my_grants"); S.grants = g.data || [];
}
async function refresh() {
  if (!S.user) return;
  try { await loadMine(); if (S.tab === "family" || S.tab === "more") await loadFamily(); if (S.admin) await loadAdmin(); } catch (e) { S.msg = { bad: true, text: "불러오지 못했습니다: " + e.message }; }
  render();
}
async function send(command, payload) {
  S.busy = true; render();
  const { error } = await sb.from("web_commands").insert({ command, payload });
  S.busy = false;
  S.msg = error ? { bad: true, text: "보내지 못했습니다: " + error.message }
                : { text: "노트북에 보냈습니다. 20초 안에 반영됩니다." };
  await refresh();
  setTimeout(refresh, 22000);
}

// ── 화면 ──
// 화면 모드: 넓은 화면(PC·맥북) = 왼쪽 메뉴 + 넓은 대시보드 / 좁은 화면(폰) = 위 요약 + 아래 탭. 직접 바꾸면 기억.
function layout() {
  let pref = null; try { pref = localStorage.getItem("layout"); } catch (e) {}
  if (pref === "pc" || pref === "phone") return pref;
  return window.innerWidth >= 900 ? "pc" : "phone";
}
const VIEWS = { admin: "회원 관리", home: "대시보드", orders: "오늘 밤 주문", approve: "승인", board: "게시판", family: "가족·공유", settings: "설정", more: "더보기" };
function currentView() {
  if (S.tab === "home") return viewHome(S.snap, true);
  if (S.tab === "orders") return viewOrders();
  if (S.tab === "approve") return viewApprove();
  if (S.tab === "board") return viewBoard();
  if (S.tab === "settings") return viewSettings();
  if (S.tab === "more") return viewAdmin() + viewFamily() + viewSettings();
  if (S.tab === "admin") return viewAdmin();
  return viewFamily();
}
function renderPending() {
  $app.innerHTML = `<div class="card login">
    <h1>${S.status === "rejected" ? "가입이 승인되지 않았습니다" : "관리자 승인을 기다리고 있습니다"}</h1>
    <div class="small muted">${esc(S.user.email)}</div>
    <div>${S.status === "rejected" ? "관리자에게 문의해 주세요." : "관리자가 승인하면 이 화면에서 바로 쓸 수 있습니다. 승인 뒤에는 관리자가 노트북에 내 칸(본인 메리츠 키·텔레그램 봇)을 만들어야 현황이 올라옵니다."}</div>
    <div class="row"><button class="btn primary" id="p-check">다시 확인</button><button class="btn" id="p-out">로그아웃</button></div></div>`;
  document.getElementById("p-check").onclick = () => onSession({ user: S.user });
  document.getElementById("p-out").onclick = async () => { await sb.auth.signOut(); };
}

async function loadAdmin() {
  const r = await sb.rpc("admin_members");
  S.members = r.error ? [] : (r.data || []);
  if (r.error) S.msg = { bad: true, text: "회원 목록: " + r.error.message };
}
function viewAdmin() {
  if (!S.admin) return "";
  const ms = S.members || [];
  const pend = ms.filter((m) => m.status === "pending");
  const ago = (t) => { if (!t) return "노트북 칸 없음"; const m = Math.round((Date.now() - new Date(t).getTime()) / 60000);
    return "노트북 갱신 " + (m < 60 ? m + "분" : m < 2880 ? Math.round(m / 60) + "시간" : Math.round(m / 1440) + "일") + " 전"; };
  return `<div class="card"><div class="row between"><h2>회원 관리</h2><span class="chip">관리자</span></div>
    <div class="small muted">웹앱 주소를 받은 사람이 가입하면 여기에 '승인 대기'로 나옵니다. 승인해야 현황·승인·공유를 쓸 수 있습니다.</div>

      ${rows.length ? rows.map((r) => `<div class="oline ${r.st === "걸림" ? "" : "off"}"><span class="${sideCls(r.side)}">${sideKo(r.side)}</span>

    </section>`;

function staleNote() {
  if (!S.snap) return "";
  const min = Math.round((Date.now() - new Date(S.snap.taken_at).getTime()) / 60000);
  const waiting = S.cmds.filter((c) => c.status === "pending").length;
  if (min < 30 && !(waiting && min >= 2)) return "";
  const ago = min >= 120 ? Math.round(min / 60) + "시간" : min + "분";
  return `<div class="msg warn-note">노트북 마지막 갱신 ${ago} 전 — 꺼져 있거나 잠자기 중일 수 있습니다.${waiting ? ` 웹에서 보낸 명령 ${waiting}건은 노트북이 켜지면 반영됩니다.` : ""}</div>`;
}

function viewHome(snap, mine) {
  if (!snap) return `<div class="card"><div class="empty">노트북 승인 봇이 켜지면 몇 분 안에 현황이 올라옵니다.</div>

    ["전략 잔금", "$" + money(t.cash), "주문표·VR Pool 합계", ""],

  let out = "";

  for (const [accId, acc] of Object.entries(s.accounts || {})) {

    `<div class="row between small"><span>${esc(sid)}</span><span class="chip ${r.ready ? "ok" : ""}">연속 일치 ${r.streak}/${r.need}일${r.missing && r.missing.length ? " · 남은 경우 " + r.missing.map((k) => k === "buy" ? "매수일" : "매도일").join(",") : ""}</span></div>`).join("")}</div>`;

}
function phoneHome(s, d, strat, out) {
  for (const [accId, acc] of Object.entries(s.accounts || {})) {

        <span class="chip ${acc.api ? "ok" : ""}">${acc.api ? "API" : "수동"}</span><span class="grow"></span>
        ${lc ? `<span class="chip ${lc.ok ? "ok" : "warn"}">${lc.ok ? "실제=모의" : "비교 다름"}</span>` : ""}</div>
      ${rows.length ? rows.map((g) => { const plan = (s.plans || {})[g.id], vr = (s.vr || {})[g.id], px = (s.closes || {})[g.symbol];
        const pnl = px && g.avg ? (Number(px) - Number(g.avg)) * g.qty : null;
        const sub = `${g.qty}주${g.avg ? " · 평단 " + money(g.avg) : ""}${plan ? " · T " + plan.T : vr ? " · V " + money(vr.V) : ""}`;
        return `<button class="lrow" data-detail="${esc(g.id)}"><span class="sym num">${esc(g.symbol)}</span>
          <span class="lmain"><b>${esc(stratName(g, plan))}</b><span class="small muted num">${esc(sub)}</span></span>
          <span class="lval num ${pnl > 0 ? "buy" : pnl < 0 ? "sell" : ""}">${pnl === null ? "$" + money(g.cash) : (pnl >= 0 ? "+" : "−") + money(Math.abs(pnl))}</span></button>`; }).join("")
        : `<div class="empty">전략 없음</div>`}</section>`;
  }
  out += `<div class="card"><div class="row between"><h2>자산 추이</h2><span class="small muted">하루 한 번 기록</span></div>${equityChart(d.equity || [])}</div>`;
  const ns = (d.notices || []).slice(0, 3);
  if (ns.length) out += `<div class="card"><div class="row between"><h2>최근 알림</h2><button class="btn ghost" data-tab="board">전체 보기</button></div>
    ${ns.map((n) => `<div class="small">${esc(n.text)}</div>`).join("")}</div>`;

}
function allStrategies(s) {
  return Object.entries(s.accounts || {}).flatMap(([aid, a]) => a.strategies.map((g) => ({ ...g, account: aid })));
}
function strategyCard(s, g) {
  const px = (s.closes || {})[g.symbol], plan = (s.plans || {})[g.id], vr = (s.vr || {})[g.id];
  const m = ((s.shadow || {})[g.account] || {})[g.id];
  const pnl = px && g.avg ? (Number(px) - Number(g.avg)) * g.qty : null;
  const metric = plan ? ["T · 단계", `${plan.T} / ${plan.splits} · ${plan.phase || "-"}`] :
                 vr ? ["V · Pool", `${money(vr.V)} · ${money(vr.pool)}`] : ["상태", g.active ? "켜짐" : "꺼짐"];
  const status = !g.active ? ["꺼짐", ""] : m ? (m.qty === g.qty ? ["실제 = 모의", "ok"] : [`모의 ${m.qty}주와 다름`, "warn"]) : ["모의 기록 없음", ""];
  return `<button class="card scard" data-detail="${esc(g.id)}" aria-label="${esc(g.id)} 자세히">
    <div class="row"><span class="sym num">${esc(g.symbol)}</span><b>${esc(stratName(g, plan))}</b><span class="muted small">${esc(ACC_NAME[g.account] || g.account)}</span></div>
    <div class="kv2">
      <span class="muted">보유 / 평단</span><span class="num">${g.qty}주 / ${money(g.avg)}</span>
      <span class="muted">${vr ? "Pool(잔금)" : "원장 잔금"}</span><span class="num">$${money(g.cash)}</span>
      <span class="muted">${metric[0]}</span><span class="num">${esc(metric[1])}</span>
      <span class="muted">평가손익</span><span class="num ${pnl > 0 ? "buy" : pnl < 0 ? "sell" : ""}">${pnl === null ? "-" : (pnl >= 0 ? "+" : "−") + "$" + money(Math.abs(pnl))}</span>
    </div>
    <span class="chip ${status[1]}" style="align-self:flex-start">${status[0]}</span></button>`;
}
function stratName(g, plan) {
  if (g.kind === "sheet") return `무한매수 ${plan && plan.splits ? Number(plan.splits) + "분할" : ""} 주문표`;
  if (g.kind === "vr") return `VR${g.multiplier > 1 ? " " + g.multiplier + "배수" : ""}`;
  if (g.kind === "infinite_buy_v4") return "무한매수 V4.0";
  return kindKo(g.kind);
}
function equityChart(rows) {
  const pts = rows.filter((r) => r.value !== null && r.value !== undefined).map((r) => ({ d: r.date, v: Number(r.value) }));
  if (pts.length < 2) return `<div class="empty">오늘부터 매일 한 번 평가금액을 기록합니다. 이틀째부터 그래프가 그려집니다.${pts.length ? ` (오늘 $${money(pts[0].v)})` : ""}</div>`;
  const W = window.innerWidth < 700 ? 460 : 1000, H = window.innerWidth < 700 ? 260 : 240, P = 34, lo = Math.min(...pts.map((p) => p.v)), hi = Math.max(...pts.map((p) => p.v));
  const pad = (hi - lo) * 0.15 || hi * 0.02, y0 = lo - pad, y1 = hi + pad;
  const X = (i) => P + i * (W - P * 2) / (pts.length - 1), Y = (v) => H - 24 - (v - y0) / (y1 - y0) * (H - 44);
  const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const area = `${X(0).toFixed(1)},${H - 24} ${line} ${X(pts.length - 1).toFixed(1)},${H - 24}`;
  const ticks = [y0 + (y1 - y0) * 0.2, y0 + (y1 - y0) * 0.5, y0 + (y1 - y0) * 0.8];

  return `
    <div class="card"><h2>볼 수 있는 사람</h2>
      ${S.owners.length ? S.owners.map((o) => `<div class="row between"><span>${esc(o.display_name)} <span class="chip">${o.relation === "family" ? "가족" : "허락받음"}</span></span>
        <button class="btn" data-view="${esc(o.owner_id)}">보기</button></div>`).join("") : `<div class="empty">아직 없습니다. 가족이 나를 추가하면 여기에 나옵니다.</div>`}</div>
    <div class="card"><h2>내 현황 보여 주기</h2>
      <form id="f-grant" class="row" style="align-items:flex-end">
        <label style="flex:2;min-width:180px">상대 이메일 (가입한 사람)<input type="email" id="g-email" required></label>
        <label style="flex:1;min-width:120px">관계<select id="g-rel"><option value="family">가족 (기한 없음)</option><option value="other">그 밖 (30일)</option></select></label>
        <button class="btn primary">추가</button></form>
      ${given.length ? given.map((g) => `<div class="row between small"><span>${esc(g.other_name || g.other_email)} · ${g.level === "detail" ? "자세히" : "요약"}${g.note ? " · " + esc(g.note) : ""}</span>
        <span class="row">${g.status === "pending" ? `<button class="btn primary" data-decide="${g.id}" data-ok="1">허락</button><button class="btn" data-decide="${g.id}" data-ok="0">거절</button>`
          : g.status === "approved" ? `<span class="chip ok">보는 중</span><button class="btn danger" data-revoke="${esc(g.other_email)}">회수</button>` : `<span class="chip">${esc(g.status)}</span>`}</span></div>`).join("") : ""}
    </div>
    <div class="card"><h2>다른 사람 현황 요청</h2>
      <form id="f-req" class="row" style="align-items:flex-end">
        <label style="flex:2;min-width:180px">상대 이메일<input type="email" id="r-email" required></label>
        <label style="flex:2;min-width:160px">요청 사유<input type="text" id="r-note" placeholder="예: 같은 전략 비교"></label>
        <button class="btn">요청</button></form>
      ${received.filter((g) => g.status !== "approved").map((g) => `<div class="small muted">${esc(g.other_name || g.other_email)}: ${g.status === "pending" ? "승인 대기" : esc(g.status)}</div>`).join("")}
    </div>`;
}

function renderLogin() {
  $app.innerHTML = `<div class="card login">
    <h1>내 자동매매</h1><div class="small muted">메리츠 자동매매 현황 · 승인 · 가족 공유</div>
    ${S.msg ? `<div class="msg ${S.msg.bad ? "bad" : ""}">${esc(S.msg.text)}</div>` : ""}
    <form id="f-login" style="display:flex;flex-direction:column;gap:10px">
      <label>이메일<input type="email" id="l-email" autocomplete="username" required></label>
      <label>비밀번호<input type="password" id="l-pw" autocomplete="current-password" minlength="8" required></label>
      <label id="l-name-wrap" hidden>이름 (가족에게 보일 이름)<input type="text" id="l-name"></label>
      <div class="row"><button class="btn primary" id="l-go">로그인</button><button class="btn" type="button" id="l-mode">처음이면 가입</button></div>
    </form></div>`;
  let signup = false;
  document.getElementById("l-mode").onclick = () => { signup = !signup;
    document.getElementById("l-name-wrap").hidden = !signup;
    document.getElementById("l-go").textContent = signup ? "가입" : "로그인";
    document.getElementById("l-mode").textContent = signup ? "이미 가입했으면 로그인" : "처음이면 가입"; };
  document.getElementById("f-login").onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById("l-email").value.trim(), password = document.getElementById("l-pw").value;
    if (signup) {
      const { error } = await sb.auth.signUp({ email, password, options: { data: { display_name: document.getElementById("l-name").value.trim() || email.split("@")[0] } } });
      S.msg = error ? { bad: true, text: "가입 실패: " + error.message } : { text: "가입했습니다. 메일함의 확인 링크를 누른 뒤 로그인하세요." };
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      S.msg = error ? { bad: true, text: "로그인 실패: 이메일·비밀번호를 확인하세요 (" + error.message + ")" } : null;
    }
    render();
  };
}

function bind() {
  const br = document.getElementById("b-refresh"); if (br) br.onclick = () => { S.msg = null; refresh(); };
  const bo = document.getElementById("b-out"); if (bo) bo.onclick = async () => { await sb.auth.signOut(); };
  const bl = document.getElementById("b-layout"); if (bl) bl.onclick = () => {
    try { localStorage.setItem("layout", layout() === "pc" ? "phone" : "pc"); } catch (e) {} render(); };
  document.querySelectorAll("[data-mdec]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("admin_decide", { p_user: b.dataset.mdec, p_status: b.dataset.st, p_role: b.dataset.role || null });
    S.msg = r.error ? { bad: true, text: r.error.message } : { text: "바꿨습니다." };
    await loadAdmin(); render(); });
  document.querySelectorAll("[data-ordacc]").forEach((b) => b.onclick = () => { S.ordAcc = b.dataset.ordacc; render(); });
  document.querySelectorAll("[data-detail]").forEach((b) => b.onclick = () => { S.tab = "home"; S.detail = b.dataset.detail; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-back-home]").forEach((b) => b.onclick = () => { S.detail = null; render(); });
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = async () => {
    S.tab = b.dataset.tab; S.msg = null; S.confirm = null; S.viewing = null; S.detail = null;
    try { localStorage.setItem("tab", S.tab); } catch (e) {}
    if (S.tab === "family" || S.tab === "more") await loadFamily().catch(() => {});
    render(); });
  document.querySelectorAll("input[data-n]").forEach((cb) => cb.onchange = () =>
    send("toggle_line", { sid: cb.dataset.sid, n: Number(cb.dataset.n), trade_date: cb.dataset.td }));
  document.querySelectorAll("[data-ask]").forEach((b) => b.onclick = () => { S.confirm = { sid: b.dataset.sid, kind: b.dataset.ask }; render(); });
  document.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = () => { S.confirm = null; render(); });
  document.querySelectorAll("[data-do]").forEach((b) => b.onclick = () => { S.confirm = null;
    send(b.dataset.do, { sid: b.dataset.sid, trade_date: b.dataset.td }); });
  document.querySelectorAll("[data-view]").forEach((b) => b.onclick = async () => {
    S.viewing = b.dataset.view; const r = await sb.rpc("view_snapshot", { p_owner: S.viewing });
    S.viewSnap = r.error ? null : r.data; if (r.error) S.msg = { bad: true, text: r.error.message }; render(); });
  document.querySelectorAll("[data-back]").forEach((b) => b.onclick = () => { S.viewing = null; render(); });
  document.querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => { S.newKind = b.dataset.kind; render(); });
  document.querySelectorAll("[data-on]").forEach((cb) => cb.onchange = () => send("set_strategy", { id: cb.dataset.on, active: cb.checked }));
  document.querySelectorAll("[data-mv]").forEach((sel) => sel.onchange = () => send("set_strategy", { id: sel.dataset.mv, account: sel.value }));
  const fa = document.getElementById("f-acc");
  if (fa) fa.onsubmit = (e) => { e.preventDefault();
    send("add_account", { id: document.getElementById("a-id").value.trim().toLowerCase(), name: document.getElementById("a-name").value.trim() }); };
  const fs = document.getElementById("f-str");
  if (fs) fs.onsubmit = (e) => { e.preventDefault();
    const kind = S.newKind || "sheet", v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
    const p = { kind, id: v("s-id").toLowerCase(), symbol: v("s-symbol"), account: v("s-account") };
    for (const [k] of KIND_FIELDS[kind]) { const x = v("s-" + k); if (x !== "") p[k] = x.replace(/,/g, ""); }
    send("add_strategy", p); };
  const fg = document.getElementById("f-grant");
  if (fg) fg.onsubmit = async (e) => { e.preventDefault();
    const rel = document.getElementById("g-rel").value;
    const r = await sb.rpc("grant_access", { p_viewer_email: document.getElementById("g-email").value.trim(), p_level: "detail",
      p_relation: rel, p_days: rel === "family" ? null : 30 });
    S.msg = r.error ? { bad: true, text: r.error.message } : { text: "추가했습니다. 상대가 '볼 수 있는 사람'에서 봅니다." };
    await loadFamily(); render(); };
  const fr = document.getElementById("f-req");
  if (fr) fr.onsubmit = async (e) => { e.preventDefault();
    const r = await sb.rpc("request_access", { p_owner_email: document.getElementById("r-email").value.trim(), p_level: "summary",
      p_note: document.getElementById("r-note").value.trim() || null });
    S.msg = r.error ? { bad: true, text: r.error.message } : { text: "요청했습니다. 상대가 허락하면 '볼 수 있는 사람'에 나옵니다." };
    await loadFamily(); render(); };
  document.querySelectorAll("[data-decide]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("decide_access", { p_grant_id: Number(b.dataset.decide), p_approve: b.dataset.ok === "1", p_days: 30, p_level: null });
    S.msg = r.error ? { bad: true, text: r.error.message } : { text: b.dataset.ok === "1" ? "30일 동안 요약을 볼 수 있게 했습니다." : "거절했습니다." };
    await loadFamily(); render(); });
  document.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("revoke_access", { p_viewer_email: b.dataset.revoke });
    S.msg = r.error ? { bad: true, text: r.error.message } : { text: "회수했습니다." };
    await loadFamily(); render(); });
}

// ── 시작 ──
async function onSession(session) {
  S.user = session ? session.user : null;
  if (S.user) {
    const p = await sb.from("profiles").select("display_name,status,role").eq("user_id", S.user.id).limit(1);
    const me = (p.data && p.data[0]) || {};
    S.name = me.display_name || S.user.email.split("@")[0];
    S.status = me.status || "approved";            // 회원 승인 기능 이전 데이터베이스면 승인으로 본다
    S.admin = me.role === "admin";
    if (S.status !== "approved") return renderPending();
    await refresh();
  } else render();
}
sb.auth.onAuthStateChange((_e, session) => { if ((session && session.user.id) !== (S.user && S.user.id)) onSession(session); });
sb.auth.getSession().then(({ data }) => onSession(data.session));
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 30000);
let _lastMode = null;
window.addEventListener("resize", () => { const m = layout(); if (m !== _lastMode) { _lastMode = m; if (S.user) render(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
</script>
</body>
</html>
