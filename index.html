// ── 웹 사진 올리기 (ADR 0029): 브라우저에서 업로드 암호로 잠가(AES-GCM) 맡기고, 노트북이 받아 풀고 바로 지운다 ──
async function lockFile(file, pass) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const nb = enc.encode(file.name || "photo").slice(0, 500), data = new Uint8Array(await file.arrayBuffer());
  const plain = new Uint8Array(2 + nb.length + data.length);
  plain[0] = nb.length >> 8; plain[1] = nb.length & 255; plain.set(nb, 2); plain.set(data, 2 + nb.length);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plain));
  const out = new Uint8Array(32 + ct.length); out.set(enc.encode("ATP1"), 0); out.set(salt, 4); out.set(iv, 20); out.set(ct, 32);
  return new Blob([out], { type: "application/octet-stream" });
}

function viewOrders() {

  const accs = Object.entries(s.accounts || {}).filter(([, a]) => a.strategies.length);
  const cur = S.ordAcc && accs.find(([k]) => k === S.ordAcc) ? S.ordAcc : (accs[0] || [])[0];
  const kind = S.ordKind || "real";
  let out = `<div class="row">${accs.map(([k, a]) => `<button class="btn ${k === cur ? "primary" : ""}" data-ordacc="${esc(k)}">${esc(ACC_NAME[k] || a.name)}</button>`).join("")}
    <span class="grow"></span>
    <div class="seg" role="group" aria-label="주문 종류"><button class="${kind === "real" ? "on" : ""}" data-ordkind="real">실제로 넣을 주문</button><button class="${kind === "sim" ? "on" : ""}" data-ordkind="sim">모의 주문</button></div></div>`;
  const acc = (s.accounts || {})[cur];
  if (!acc) return out;

  const tn = (d.tonight || {})[cur] || [];
  for (const g of acc.strategies) {
    const plan = (s.plans || {})[g.id];
    const rows = plan ? plan.lines.map((l) => ({ ...l, st: l.on ? "걸림" : "체크 해제" }))
                      : tn.filter((o) => o.strategy_id === g.id).map((o) => ({ ...o, st: "걸림" }));
    out += `<section class="card"><div class="row between"><h2><span class="sym num">${esc(g.symbol)}</span> ${esc(stratName(g, plan))}</h2>
        <span class="small muted">${plan ? `미국 ${esc(plan.trade_date)} 장 · ${esc(plan.phase || "")}` : ""}</span></div>
      ${rows.length ? rows.map((r) => `<div class="oline ${r.st === "걸림" ? "" : "off"}"><span class="${sideCls(r.side)}">${sideKo(r.side)}</span>
          <span class="small muted num">${esc(r.kind)}</span><b class="num">${money(r.price)} × ${r.qty}</b>
          <span class="chip ${r.st === "걸림" ? "ok" : ""}">${r.st}</span></div>`).join("") : `<div class="empty">오늘 밤 주문 없음 (승인 전이거나 해당 없음)</div>`}
    </section>`;
  }
  return out;
}
const KIND_KO = { LOC: "LOC", LIMIT: "지정가", MARKET: "시장가", MOC: "MOC", LIMIT_VWAP: "VWAP" };
function realOrders(s, d, cur, acc) {
  const r = (d.real_orders || {})[cur];
  const vr = acc.strategies.filter((g) => g.kind === "vr");
  let out = `<div class="msg">메리츠 앱에 이 목록대로 넣으면 됩니다. <b>거부 예상</b> 줄은 현재가 ±10% 밖이라 증권사가 받지 않으니 옆의 가격으로 넣으세요. 노트북이 증권사 <b>실제 보유</b>와 승인한 주문표로 계산했습니다 (노트북 <span class="mono">autotrader tonight</span> 와 같음).</div>`;
  if (!r) return out + `<div class="card"><div class="empty">${acc.api ? "노트북이 아직 실제 보유를 조회하지 않았습니다 (봇 재시작 뒤 몇 분)." : "이 계좌는 API 키가 없어 실제 보유로 계산할 수 없습니다."}</div></div>`;
  if (r.error) return out + `<div class="card"><div class="empty">실제 보유 조회 실패 (${esc(r.error)}) — 노트북에서 autotrader doctor 로 확인</div></div>`;
  if (r.buy_need !== undefined) {
    const need = Number(r.buy_need || 0), vrn = Number(r.vr_buy_need || 0), short = Number(r.short || 0);
    const parts = `매수가 모두 체결되면 <b class="num">$${money(need)}</b>${vrn ? ` · VR 남은 매수 <b class="num">$${money(vrn)}</b>` : ""}`;
    out += r.cash === undefined || r.cash === null
      ? `<div class="card small">예수금: ${parts} 필요 (주문가능금액 조회 못 함)</div>`
      : `<div class="card ${short > 0 ? "warn-note" : ""}"><div class="row between"><b>${short > 0 ? "⚠ 예수금 부족" : "✅ 예수금 충분"}</b>
          <span class="small">주문가능 <b class="num">$${money(r.cash)}</b> (원화 통합증거금 포함)</span></div>
          <div class="small">${parts} 필요${short > 0 ? ` → <b class="num">$${money(short)}</b> 입금하면 모두 걸 수 있습니다` : ""}</div></div>`;
  }
  for (const row of r.strategies || []) {
    out += `<section class="card"><div class="row between"><h2><span class="sym num">${esc(row.symbol)}</span> ${esc(row.sid)}</h2>
      <span class="small muted">미국 ${esc(r.trade_date)} 장</span></div>`;
    if (!row.approved) { out += `<div class="empty">아직 승인한 ${esc(r.trade_date)} 주문표가 없습니다 → 승인 탭</div></section>`; continue; }
    out += `<div class="small">${row.current ? `현재가 <b class="num">${money(row.current)}</b> · ` : ""}실제 보유 <b class="num">${row.real}주</b> · 주문표 ${row.want}주 ${row.diff === 0 ? '<span class="chip ok">같음</span>' : `<span class="chip warn">차이 ${row.diff > 0 ? "+" : ""}${row.diff}주 → 아래에 맞춤 주문 포함</span>`}</div>
      ${row.lines.map((l) => `<div class="oline"><span class="${sideCls(l.side)}">${sideKo(l.side)}</span><span class="small muted">${esc(KIND_KO[l.kind] || l.kind)}</span>
        <b class="num">${l.price ? money(l.price) : "시장가"} × ${l.qty}</b>${l.collar ? `<span class="chip bad" title="현재가 ±10% 밖이면 증권사가 거부">거부 예상 → ${money(l.collar)}${l.side === "BUY" ? " 이하" : " 이상"}</span>` : l.catchup ? '<span class="chip warn">보충</span>' : "<span></span>"}</div>`).join("")}
      ${(row.warnings || []).map((w) => `<div class="small" style="color:var(--warn)">! ${esc(w)}</div>`).join("")}</section>`;
  }
  if (vr.length) out += `<div class="card"><div class="small muted">VR 은 2주 단위 예약주문(기간잔량)이라 매일 넣지 않습니다. 단계와 체결 여부는 전략 화면에서 확인하세요.</div>
    ${vr.map((g) => `<button class="btn" data-detail="${esc(g.id)}">${esc(g.symbol)} VR 사다리 보기</button>`).join("")}</div>`;
  return out;
}

function staleNote() {
  if (!S.snap) return "";
  const min = Math.round((Date.now() - new Date(S.snap.taken_at).getTime()) / 60000);
  const waiting = S.cmds.filter((c) => c.status === "pending").length;
  if (min < 30 && !(waiting && min >= 2)) return "";
  const ago = min >= 120 ? Math.round(min / 60) + "시간" : min + "분";
  return `<div class="msg warn-note">노트북 마지막 갱신 ${ago} 전 — 꺼져 있거나 잠자기 중일 수 있습니다.${waiting ? ` 웹에서 보낸 명령 ${waiting}건은 노트북이 켜지면 반영됩니다.` : ""}</div>`;
}

function viewHome(snap, mine) {

    ["승인 대기", draftN + "건", draftN ? "승인 탭에서 확인" : "없음", draftN ? "warnc" : ""],
  ];
  let out = "";
  if (s.halted) out += `<div class="card"><span class="chip bad">자동매매 정지</span><div>${esc(s.halted)}</div></div>`;
  if (layout() === "phone" && mine) return phoneHome(s, d, strat, out);
  out += marketStrip(s);
  out += `<section class="kpis" aria-label="요약">${kpis.map(([l, v, sub, c]) => `<div class="card kpi"><span class="small muted">${l}</span>
    <b class="num ${c}">${v}</b><span class="muted" style="font-size:12px">${sub}</span></div>`).join("")}</section>`;
  out += `<div class="card"><div class="row between"><h2>자산 추이 (USD)</h2><span class="small muted">하루 한 번 기록</span></div>${equityChart(d.equity || [])}</div>`;

// ── 주문표 달력: 실행일(미국 장 날짜)을 고르면 그날 주문표·모의 체결·실제 vs 모의 결과 ──
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const ymd = (y, m, d) => `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
function calData() {
  const d = (S.snap && S.snap.detail) || {}, hist = d.sheet_history || {}, chk = d.live_check || {};
  const days = {};
  for (const [td, sheets] of Object.entries(hist)) days[td] = { sheets, checks: {} };
  for (const [acc, log] of Object.entries(chk)) for (const [td, r] of Object.entries(log)) {
    (days[td] = days[td] || { sheets: [], checks: {} }).checks[acc] = r; }
  return days;
}
function viewCalendar() {
  if (!S.snap) return `<div class="card"><div class="empty">노트북이 연결되면 주문표 달력이 보입니다.</div></div>`;
  const days = calData(), keys = Object.keys(days).sort();
  if (!keys.length) return `<div class="card"><h2>주문표 달력</h2><div class="empty">아직 기록이 없습니다. 노트북을 업데이트하면 승인한 주문표가 날짜별로 쌓입니다.</div></div>`;
  const plans = Object.values(S.snap.summary.plans || {}).map((p) => p.trade_date).sort();
  const nextTd = plans[plans.length - 1] || keys[keys.length - 1];
  const sel = S.calDay && days[S.calDay] ? S.calDay : (days[nextTd] ? nextTd : keys[keys.length - 1]);
  const ym = S.calMonth || sel.slice(0, 7);
  const [Y, M] = ym.split("-").map(Number);
  const first = new Date(Date.UTC(Y, M - 1, 1)).getUTCDay(), last = new Date(Date.UTC(Y, M, 0)).getUTCDate();
  const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
  const cells = [];
  for (let i = 0; i < first; i++) cells.push(`<button class="empty" tabindex="-1" aria-hidden="true"></button>`);
  for (let dd = 1; dd <= last; dd++) {
    const k = ymd(Y, M, dd), v = days[k];
    const checks = v ? Object.values(v.checks) : [];
    const res = checks.length ? (checks.every((c) => c.ok) ? `<span class="res ok">일치</span>` : `<span class="res warn">차이</span>`)
      : (k === nextTd ? `<span class="res">다음 장</span>` : "");
    cells.push(`<button class="${v ? "has" : "nodata"} ${k === sel ? "sel" : ""} ${k === today ? "today" : ""}" ${v ? `data-calday="${k}"` : 'tabindex="-1"'}
      aria-label="${M}월 ${dd}일${v ? " 주문표 " + v.sheets.length + "건" : ""}"><b class="num">${dd}</b>
      ${v ? `<span class="tags">${v.sheets.map((x) => `<i>${esc(x.symbol)}</i>`).join("")}</span>${res}` : ""}</button>`);
  }
  const shift = (n) => { const t = new Date(Date.UTC(Y, M - 1 + n, 1)); return t.toISOString().slice(0, 7); };
  let out = `<section class="card"><div class="row between"><h2>주문표 달력</h2>
      <div class="row"><button class="btn" data-calm="${shift(-1)}" aria-label="이전 달">‹</button><b class="num">${Y}년 ${M}월</b>
      <button class="btn" data-calm="${shift(1)}" aria-label="다음 달">›</button></div></div>
    <div class="small muted">날짜 = 미국 장 날짜(실행일). 한국 시간으로는 그날 밤~다음 날 새벽입니다.</div>
    <div class="cal" style="margin-top:8px">${DOW.map((w) => `<span class="dow">${w}</span>`).join("")}${cells.join("")}</div></section>`;

}
function calDay(td, v) {

    const facts = [["종가 (" + esc(String(x.sheet_date || "").slice(5).replace("-", "/")) + ")", money(x.close)], ["평단", money(x.avg)], ["보유", (x.holding ?? "-") + "주"],
      ["잔금", "$" + money(x.cash)], ["T", x.T ?? "-"], ["1회매수", money(x.unit)]];
    out += `<section class="card"><div class="row between"><h2><span class="sym num">${esc(x.symbol)}</span> ${esc(x.sid)}</h2>
        <span class="small muted">${esc(ACC_NAME[x.account] || x.account)}${x.multiplier > 1 ? " · ×" + x.multiplier : ""}</span></div>
      <div class="kv">${facts.map(([l, val]) => `<div><span class="small muted">${l}</span><b>${val}</b></div>`).join("")}</div>
      <div class="scroll"><table><thead><tr><th>구분</th><th>유형</th><th class="n">가격</th><th class="n">수량</th><th>결과</th></tr></thead>
        <tbody>${on.map(row).join("")}${x.catchup ? `<tr><td class="buy">매수</td><td class="small muted">보충</td><td class="n">${money(x.catchup[1])}</td><td class="n">${x.catchup[0]}주</td><td><span class="chip ok">모의 체결</span></td></tr>` : ""}</tbody></table></div>
      ${off.length ? `<details><summary class="small muted">꺼 둔 아래 사다리 ${off.length}줄${off.some((l) => l[5]) ? " (일부 모의 체결)" : ""}</summary>

      ${(c.rows || []).map((r) => `<div class="small">${r.real_qty === r.sim_qty ? "✅" : "❌"} ${esc(r.sym)} ${sideKo(r.side)}: 실제 <b class="num">${r.real_qty}주</b>${r.real_avg ? " @" + money(r.real_avg) : ""} / 모의 <b class="num">${r.sim_qty}주</b>${r.sim_avg ? " @" + money(r.sim_avg) : ""}</div>`).join("")}
      ${Object.entries(c.hold || {}).map(([sym, [a, b]]) => `<div class="small">${a === b ? "✅" : "❌"} ${esc(sym)} 보유: 실제 ${a}주 / 모의 ${b}주</div>`).join("")}
      ${!(c.rows || []).length && !Object.keys(c.hold || {}).length ? `<div class="small muted">체결·보유 ${c.fills_ok ? "일치" : "다름"} / ${c.hold_ok ? "일치" : "다름"} (자세한 줄은 다음 비교부터 기록)</div>` : ""}</div>`).join("")}</section>`;
  } else if (v.sheets.length) {
    out += `<div class="card"><div class="small muted">실제 vs 모의 비교는 이 날 장이 끝난 뒤 아침 07:10 에 기록됩니다.</div></div>`;

        <label style="flex:2;min-width:160px">요청 사유<input type="text" id="r-note" placeholder="예: 같은 전략 비교"></label>
        <button class="btn">요청</button></form>
      ${received.filter((g) => g.status !== "approved").map((g) => `<div class="small muted">${esc(g.other_name || g.other_email)}: ${g.status === "pending" ? "승인 대기" : esc(g.status)}</div>`).join("")}
    </div>`;
}

function renderLogin() {
  $app.innerHTML = `<div class="card login">
    <h1>내 자동매매</h1><div class="small muted">메리츠 자동매매 현황 · 승인 · 가족 공유</div>
    ${S.msg ? `<div class="msg ${S.msg.bad ? "bad" : ""}">${esc(S.msg.text)}</div>` : ""}
    <form id="f-login" style="display:flex;flex-direction:column;gap:10px">
      <label>이메일<input type="email" id="l-email" autocomplete="username" required></label>
      <label>비밀번호<input type="password" id="l-pw" autocomplete="current-password" minlength="8" required></label>
      <label id="l-name-wrap" hidden>이름 (가족에게 보일 이름)<input type="text" id="l-name"></label>
      <div class="row"><button class="btn primary" id="l-go">로그인</button><button class="btn" type="button" id="l-mode">처음이면 가입</button>
        <button class="btn ghost" type="button" id="l-reset">비밀번호를 잊었어요</button></div>
    </form></div>`;
  let signup = false;
  document.getElementById("l-mode").onclick = () => { signup = !signup;
    document.getElementById("l-name-wrap").hidden = !signup;
    document.getElementById("l-go").textContent = signup ? "가입" : "로그인";
    document.getElementById("l-mode").textContent = signup ? "이미 가입했으면 로그인" : "처음이면 가입"; };
  document.getElementById("l-reset").onclick = async () => {
    const email = document.getElementById("l-email").value.trim();
    if (!email) { S.msg = { bad: true, text: "이메일 칸을 먼저 채워 주세요" }; return render(); }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    S.msg = error ? { bad: true, text: ko(error.message) } : { text: "비밀번호를 다시 정하는 링크를 메일로 보냈습니다." }; render(); };
  document.getElementById("f-login").onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById("l-email").value.trim(), password = document.getElementById("l-pw").value;
    if (signup) {
      const { error } = await sb.auth.signUp({ email, password, options: { data: { display_name: document.getElementById("l-name").value.trim() || email.split("@")[0] } } });
      S.msg = error ? { bad: true, text: "가입 실패: " + ko(error.message) } : { text: "가입했습니다. 메일함의 확인 링크를 누른 뒤 로그인하세요." };
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      S.msg = error ? { bad: true, text: "로그인 실패: " + ko(error.message) } : null;
    }
    render();
  };
}

function bind() {
  const br = document.getElementById("b-refresh"); if (br) br.onclick = () => { S.msg = null; refresh(); };
  const bo = document.getElementById("b-out"); if (bo) bo.onclick = async () => { await sb.auth.signOut(); };
  const bl = document.getElementById("b-layout"); if (bl) bl.onclick = () => {
    try { localStorage.setItem("layout", layout() === "pc" ? "phone" : "pc"); } catch (e) {} render(); };
  document.querySelectorAll("[data-mdec]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("admin_decide", { p_user: b.dataset.mdec, p_status: b.dataset.st, p_role: b.dataset.role || null });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "바꿨습니다." };
    await loadAdmin(); render(); });
  document.querySelectorAll("[data-ordkind]").forEach((b) => b.onclick = () => { S.ordKind = b.dataset.ordkind; render(); });
  document.querySelectorAll("[data-ordacc]").forEach((b) => b.onclick = () => { S.ordAcc = b.dataset.ordacc; render(); });
  const actSel = document.getElementById("act-as"); if (actSel) actSel.onchange = async () => {
    S.actAs = actSel.value || null; try { if (S.actAs) localStorage.setItem("actAs", S.actAs); else localStorage.removeItem("actAs"); } catch (e) {}
    S.detail = null; S.msg = { text: S.actAs ? "공동 운영 계좌로 바꿨습니다. 승인·설정은 그 계좌 노트북으로 갑니다." : "내 계좌로 돌아왔습니다." }; await refresh(); };
  document.querySelectorAll("[data-uppurpose]").forEach((b) => b.onclick = () => { S.upPurpose = b.dataset.uppurpose; S.upOpen = true; render(); });
  const fup = document.getElementById("f-up"); if (fup) fup.onsubmit = (e) => { e.preventDefault();
    const files = document.getElementById("up-files").files; if (!files.length) return;
    uploadPhotos(files, document.getElementById("up-pass").value, document.getElementById("up-remember").checked); };
  const upc = document.getElementById("up-card"); if (upc) upc.ontoggle = () => { S.upOpen = upc.open; };
  document.querySelectorAll("[data-operate]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("set_operate", { p_grant: Number(b.dataset.operate), p_on: b.dataset.on === "true" });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: b.dataset.on === "true" ? "공동 운영을 켰습니다. 상대가 내 계좌를 승인·설정할 수 있습니다." : "공동 운영을 껐습니다." };
    await loadFamily(); render(); });
  document.querySelectorAll("[data-fbopen]").forEach((b) => b.onclick = () => openFeedback(b.dataset.fbopen));
  document.querySelectorAll("[data-fbclose]").forEach((b) => b.onclick = () => { S.fbForm = null; render(); });
  const fbAt = document.getElementById("fb-attach"); if (fbAt) fbAt.onchange = () => { const t = document.getElementById("fb-body").value; S.fbForm.attach = fbAt.checked; render(); document.getElementById("fb-body").value = t; };
  const fbSend = document.getElementById("fb-send"); if (fbSend) fbSend.onclick = () => { const t = document.getElementById("fb-body").value.trim();
    if (!t) { S.fbForm.note = "내용을 한 줄이라도 적어 주세요"; const v = t; render(); document.getElementById("fb-body").value = v; return; } sendFeedback(t); };
  document.querySelectorAll("[data-fbshot]").forEach((b) => b.onclick = async () => {
    const r = await sb.storage.from("feedback").createSignedUrl(b.dataset.path, 600);
    S.fbShot = r.error ? null : { id: Number(b.dataset.fbshot), url: r.data.signedUrl }; if (r.error) S.msg = { bad: true, text: ko(r.error.message) }; render(); });
  document.querySelectorAll("[data-flag]").forEach((b) => b.onclick = async () => {
    const val = b.dataset.val === "true";
    const r = await sb.from("site_flags").upsert({ key: b.dataset.flag, value: val, updated_at: new Date().toISOString() });
    if (r.error) S.msg = { bad: true, text: ko(r.error.message) }; else { S.flags[b.dataset.flag] = val; S.msg = { text: val ? "버튼을 다시 켰습니다." : "버튼과 게시판을 껐습니다." }; }
    render(); });
  document.querySelectorAll("[data-calday]").forEach((b) => b.onclick = () => { S.calDay = b.dataset.calday; S.calMonth = S.calDay.slice(0, 7); render(); });
  document.querySelectorAll("[data-calm]").forEach((b) => b.onclick = () => { S.calMonth = b.dataset.calm; render(); });
  document.querySelectorAll("[data-detail]").forEach((b) => b.onclick = () => { S.tab = "home"; S.detail = b.dataset.detail; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-back-home]").forEach((b) => b.onclick = () => { S.detail = null; render(); });
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = async () => {
    S.tab = b.dataset.tab; S.msg = null; S.confirm = null; S.viewing = null; S.detail = null;
    try { localStorage.setItem("tab", S.tab); } catch (e) {}
    if (S.tab === "family" || S.tab === "more") await loadFamily().catch(() => {});
    if (S.tab === "fb_bug" || S.tab === "fb_idea") { S.fbShot = null; await loadFeedback(S.tab === "fb_bug" ? "bug" : "idea").catch(() => {}); }
    render(); });
  document.querySelectorAll("input[data-n]").forEach((cb) => cb.onchange = () =>
    send("toggle_line", { sid: cb.dataset.sid, n: Number(cb.dataset.n), trade_date: cb.dataset.td }));
  document.querySelectorAll("[data-ask]").forEach((b) => b.onclick = () => { S.confirm = { sid: b.dataset.sid, kind: b.dataset.ask }; render(); });
  document.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = () => { S.confirm = null; render(); });
  document.querySelectorAll("[data-do]").forEach((b) => b.onclick = () => { S.confirm = null;
    send(b.dataset.do, { sid: b.dataset.sid, trade_date: b.dataset.td }); });
  document.querySelectorAll("[data-view]").forEach((b) => b.onclick = async () => {
    S.viewing = b.dataset.view; const r = await sb.rpc("view_snapshot", { p_owner: S.viewing });
    S.viewSnap = r.error ? null : clean(r.data); if (r.error) S.msg = { bad: true, text: r.error.message }; render(); });
  document.querySelectorAll("[data-back]").forEach((b) => b.onclick = () => { S.viewing = null; render(); });
  document.querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => { S.newKind = b.dataset.kind; render(); });
  document.querySelectorAll("[data-on]").forEach((cb) => cb.onchange = () => send("set_strategy", { id: cb.dataset.on, active: cb.checked }));
  document.querySelectorAll("[data-mv]").forEach((sel) => sel.onchange = () => send("set_strategy", { id: sel.dataset.mv, account: sel.value }));
  const fa = document.getElementById("f-acc");
  if (fa) fa.onsubmit = (e) => { e.preventDefault();
    send("add_account", { id: document.getElementById("a-id").value.trim().toLowerCase(), name: document.getElementById("a-name").value.trim() }); };
  const prefill = () => { const sym = document.getElementById("s-symbol"), ac = document.getElementById("s-account"), q = document.getElementById("s-qty");
    if (!sym || !ac || !q || !S.snap) return; const r = ((S.snap.detail || {}).real_orders || {})[ac.value];
    const n = r && r.positions ? r.positions[sym.value] : undefined;
    if (n !== undefined) { q.value = (S.newKind === "vr") ? Math.round(n / (Number((document.getElementById("s-mult") || {}).value) || 1)) : n;
      const h = document.getElementById("s-hint"); if (h) h.textContent = `증권사 실제 보유 ${n}주를 넣었습니다 (확인 후 고치세요)`; } };
  ["s-symbol", "s-account", "s-mult"].forEach((id) => { const el = document.getElementById(id); if (el) el.addEventListener("change", prefill); });
  prefill();
  const fs = document.getElementById("f-str");
  if (fs) fs.onsubmit = (e) => { e.preventDefault();
    const kind = S.newKind || "sheet", v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
    const p = { kind, id: v("s-id").toLowerCase(), symbol: v("s-symbol"), account: v("s-account") };
    for (const [k] of KIND_FIELDS[kind]) { const x = v("s-" + k); if (x !== "") p[k] = x.replace(/,/g, ""); }
    send("add_strategy", p); };
  const fg = document.getElementById("f-grant");
  if (fg) fg.onsubmit = async (e) => { e.preventDefault();
    const rel = document.getElementById("g-rel").value;
    const r = await sb.rpc("grant_access", { p_viewer_email: document.getElementById("g-email").value.trim(), p_level: "detail",
      p_relation: rel, p_days: rel === "family" ? null : 30 });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "추가했습니다. 상대가 '볼 수 있는 사람'에서 봅니다." };
    await loadFamily(); render(); };
  const fr = document.getElementById("f-req");
  if (fr) fr.onsubmit = async (e) => { e.preventDefault();
    const r = await sb.rpc("request_access", { p_owner_email: document.getElementById("r-email").value.trim(), p_level: "summary",
      p_note: document.getElementById("r-note").value.trim() || null });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "요청했습니다. 상대가 허락하면 '볼 수 있는 사람'에 나옵니다." };
    await loadFamily(); render(); };
  document.querySelectorAll("[data-decide]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("decide_access", { p_grant_id: Number(b.dataset.decide), p_approve: b.dataset.ok === "1", p_days: 30, p_level: null });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: b.dataset.ok === "1" ? "30일 동안 요약을 볼 수 있게 했습니다." : "거절했습니다." };
    await loadFamily(); render(); });
  document.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("revoke_access", { p_viewer_email: b.dataset.revoke });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "회수했습니다." };
    await loadFamily(); render(); });
}

// ── 시작 ──
async function onSession(session) {
  S.user = session ? session.user : null;
  if (S.user) {
    const p = await sb.from("profiles").select("display_name,status,role").eq("user_id", S.user.id).limit(1);
    const me = (p.data && p.data[0]) || {};
    S.name = me.display_name || S.user.email.split("@")[0];
    S.status = me.status || "approved";            // 회원 승인 기능 이전 데이터베이스면 승인으로 본다
    S.admin = me.role === "admin";
    if (S.status !== "approved") return renderPending();
    await loadFlags().catch(() => {});
    await loadOps().catch(() => {});
    await refresh();
  } else render();
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") { S.recovery = true; S.user = session && session.user; return renderRecovery(); } if ((session && session.user.id) !== (S.user && S.user.id)) onSession(session); });
sb.auth.getSession().then(({ data }) => onSession(data.session));
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 30000);
let _lastMode = null;
window.addEventListener("resize", () => { const m = layout(); if (m !== _lastMode) { _lastMode = m; if (S.user) render(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
</script>
</body>
</html>
