  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;

}

  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --ink: #f0f3ff; --muted: #b9c2e0; --line: rgba(190, 200, 255, 0.16);
  --accent: #b8adff; --accent-ink: #15123a; --ice: #8fd0ff; --soft: rgba(184, 173, 255, 0.16);

:root[data-theme="dark"] {

  .otable { min-width: 0; table-layout: auto } .otable thead { display: none } .otable, .otable tbody { display: block }
  .otable tr { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr) max-content; gap: 2px 10px; align-items: center;
    grid-template-areas: "side px qty st" "kind kind amt put" "adm note note note"; padding: 10px 2px; border-bottom: 1px solid var(--line) }   /* 작업 ㊹-C: 매수·매도 칩 · 가격 × 수량 크게 · 상태 칩 */

function bindMfa() {
  const b = document.getElementById("b-mfa-en");
  if (b) b.onclick = async () => {
    S.busy = true; render();
    try {
      for (const f of (S.mfaUnverified || [])) await sb.auth.mfa.unenroll({ factorId: f.id });   // 등록하다 만 것 정리
      const r = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "인증 앱 " + new Date().toISOString().slice(0, 10) + " " + Math.random().toString(36).slice(2, 6) });
      if (r.error) throw r.error;
      S.mfaEnroll = { id: r.data.id, qr: r.data.totp.qr_code, secret: r.data.totp.secret }; S.msg = null;
    } catch (e) { S.msg = { bad: true, text: "등록 시작 실패: " + ko(e.message || e) + " (Supabase → Authentication → Multi-Factor 에서 TOTP 가 켜져 있는지)" }; }
    S.busy = false; render(); };
  const c = document.getElementById("me-cancel");
  if (c) c.onclick = async () => { const id = S.mfaEnroll && S.mfaEnroll.id; S.mfaEnroll = null;
    if (id) await sb.auth.mfa.unenroll({ factorId: id }).catch(() => {}); await loadAal(); render(); };
  const f = document.getElementById("f-mfa-en");
  if (f) f.onsubmit = async (e) => { e.preventDefault(); S.busy = true; render();
    const code = (document.getElementById("me-code") || {}).value || "";
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: S.mfaEnroll.id, code: code.trim() });
    S.busy = false;
    if (error) { S.msg = { bad: true, text: "등록 실패: " + ko(error.message) }; return render(); }
    S.mfaEnroll = null; await loadAal();
    S.msg = { text: "2단계 인증을 켰습니다. 다음 로그인부터 인증 앱 6자리를 넣습니다. 지금 이 화면은 이미 2단계 인증을 마친 상태입니다." }; render(); };
  document.querySelectorAll("[data-mfaoff]").forEach((x) => x.onclick = async () => {
    if (!confirm("이 인증 앱을 지울까요? 다음 로그인부터 6자리를 묻지 않습니다.")) return;
    const { error } = await sb.auth.mfa.unenroll({ factorId: x.dataset.mfaoff });
    await loadAal();
    S.msg = error ? { bad: true, text: "지우지 못했습니다: " + ko(error.message) } : { text: "인증 앱을 지웠습니다." }; render(); });
}

function keepForm() {
  const kept = { vals: {}, files: {}, focus: null };
  document.querySelectorAll("#app input[id], #app textarea[id], #app select[id]").forEach((el) => {
    if (el.type === "file") { if (el.files && el.files.length) kept.files[el.id] = Array.from(el.files); return; }
    kept.vals[el.id] = el.type === "checkbox" ? el.checked : el.value;
  });
  const a = document.activeElement;
  if (a && a.id && a.closest && a.closest("#app")) kept.focus = { id: a.id, s: a.selectionStart, e: a.selectionEnd };
  return kept;
}
function restoreForm(kept) {

  for (const [id, v] of Object.entries(kept.vals)) {

    if (el.type === "checkbox") el.checked = v; else if (el.value !== v && v !== "") el.value = v;
  }

    const el = document.getElementById(id); if (!el || skip.has(id)) continue;

  }
  document.querySelectorAll("#up-pass, #k-pass, #tg-pass").forEach((el) => el.dispatchEvent(new Event("input")));   // 한글 경고 다시 확인
  if (kept.focus) { const el = document.getElementById(kept.focus.id);
    if (el) { el.focus({ preventScroll: true }); try { if (kept.focus.s !== null) el.setSelectionRange(kept.focus.s, kept.focus.e); } catch (e) {} } }
}

        const ts = tsa.trade_date === r.trade_date ? (tsa.strategies || []).find((x) => x.sid === row.sid) : null;
        const adm = confirmOn(acc);
        const item = (l, folded) => { const lk = [row.sid, l.side, l.kind, l.price || "종가", l.qty].join("|");   // 작업 ㉒: MOC(가격 없음)도 고르기
          return { side: l.side, kind: KIND_KO[l.kind] || l.kind, price: l.price || null, priceText: l.kind === "MOC" ? "종가" : "시장가", qty: l.qty, pk: lk, exp: locHit(row.symbol, l),
            auto: l.auto_done ? "auto 가 이미 메리츠에 넣은 줄" : !folded && ts && ts.state === "done" ? "메리츠 주문내역에서 확인됨" : "",
            note: (l.auto_done ? '<span class="chip ok" title="auto 가 이미 메리츠에 넣은 줄 (작업 ㉗)">자동 주문됨</span>' : l.auto ? '<span class="chip ok" title="auto 가 켜져 있어 노트북이 이 줄을 냅니다 — manual 로 넣지 않음 (작업 ㊸)">auto 가 냄</span>' : l.collar ? `<span class="chip bad" title="그 순간 시세 대비 30% 넘게 벗어나면 증권사가 거부">거부 예상 → ${money(l.collar)}${l.side === "BUY" ? " 이하" : " 이상"}</span>` : l.catchup ? '<span class="chip warn">보충 (별도)</span>' : l.catchup_add ? `<span class="chip warn" title="메리츠 보유가 계산보다 적어 이 LOC 매수 줄에 부족분을 더함 (작업 ㊾)">부족분 ${l.catchup_add}주 포함</span>` : l.market_skip ? `<span class="chip" title="${esc(l.market_skip)}">시장가 안 냄</span>` : l.market_wait ? `<span class="chip" title="${esc(l.market_wait)}">마감 1분 전 · 조건 ${money(l.cond_price)}</span>` : l.method_note ? `<span class="chip warn">${esc(l.method_note)}</span>` : l.near ? '<span class="chip warn" title="현재가가 이 줄 근처 — 종가가 여기 이하면 체결되니 마감 전에 걸기 (주문가능금액 확인)">마감 전 걸기</span>' : l.later ? '<span class="chip" title="현재가보다 기준(3~6%)보다 더 낮음 — LOC 는 주문가능금액을 묶으니 급락할 때 마감 전에 걸기">마감 전 확인</span>' : "")
              + (l.kind === "LOC" && l.price ? locChip(row.symbol, l.side, l.price) : "")        // 작업 ㊹-B ②: 지금가 기준 체결 예상 (참고만)
              + (l.auto_wait ? ` <span class="chip ok" title="auto 가 켜져 있어 해당 장 시간·시세 조건이 되면 노트북이 자동으로 넣습니다">${esc(l.auto_wait)}</span>` : row.auto_now && !l.auto && !l.auto_done ? ' <span class="chip" title="auto 가 켜져 있어도 이 줄은 노트북이 내지 않음 — 필요하면 manual 로 (작업 ㊸)">이 줄은 auto 가 내지 않음</span>' : ""),
            admin: adm && (l.price || PRICELESS_KINDS.includes(l.kind)) ? `<input type="checkbox" class="cline" data-acc="${esc(cur)}" data-l="${esc(lk)}" ${cfChecked(lk, !folded && !l.later && !l.near && !l.catchup && !l.collar && !l.auto_done && !l.auto_wait) && !l.collar && !l.auto_done && !l.auto ? "checked" : ""} ${l.collar || l.auto_done || l.auto ? "disabled" : ""} aria-label="관리자 주문 — 이 줄 고르기">` : "" }; };
        const [show, hide] = foldBuys(row.lines);       // 작업 ㉔ E: 첫 매수점 −20% 아래 매수 줄은 접기 (펼치면 체크해 주문 가능)
        const later = (l) => l.later || l.near || l.catchup;
        const now = show.filter((l) => !later(l)), after = show.filter(later), day = "d:" + r.trade_date;
        const tsTxt = ts && ts.state !== "none" ? (ts.state === "unknown" ? "메리츠 주문내역 확인 안 됨"
          : ts.state === "done" ? `메리츠에 모두 들어감 (${ts.placed}줄)`
          : ts.auto_left && ts.auto_left === ts.left ? (ts.later_left === ts.left ? `메리츠 확인: 지금 걸 줄 완료 (${ts.placed}줄) · 하락 대비 ${ts.left}줄 시세 감시 대기 (auto)` : `메리츠 확인: 넣음 ${ts.placed} / auto 대기 ${ts.left}줄 (장 시간·조건 되면 자동 발주)`)
          : ts.later_left && ts.later_left === ts.left ? `메리츠 확인: 지금 걸 줄 완료 (${ts.placed}줄) · 마감 전 확인 ${ts.left}줄 남음`
          : `메리츠 확인: 넣음 ${ts.placed} / 남음 ${ts.left}`) : "";
        return (tsTxt ? `<div class="small muted">${esc(tsTxt)}</div>` : "")
          + `<div class="ogroup"><h3>① 지금 걸 줄 <span class="small muted">${now.length}줄</span></h3>${now.length ? oTable(now.map((l) => item(l, false)), adm, day) : '<div class="empty">지금 걸 줄이 없습니다.</div>'}</div>`
          + (after.length || hide.length ? `<div class="ogroup later"><h3>② 마감 전 확인 · 보충 (별도) <span class="small muted">${after.length}줄</span></h3>
              ${oTable(after.map((l) => item(l, false)), adm, day)}${foldBox("ord:" + row.sid, hide, oTable(hide.map((l) => item(l, true)), adm, day))}</div>` : "");
      })()}
      ${row.usd_share != null ? `<div class="small" style="margin-top:6px">이 전략 달러 예수금 몫 <b class="num">$${money(row.usd_share)}</b> <span class="muted">(달러 예수금을 주문표 잔금 비율로)</span> · 지금 걸 주 매수 <b class="num">$${money(row.lock_need)}</b> ${Number(row.usd_short) > 0 ? `<span class="chip warn">$${money(row.usd_short)} 부족</span>` : '<span class="chip ok">충분</span>'}</div>` : ""}
      ${row.later_pct && !ph ? `<div class="small muted">마감 전 확인 기준: 현재가 −${esc(row.later_pct)}% 보다 낮은 LOC 매수 줄</div>` : ""}
      ${row.band_status ? `<div class="small" style="margin-top:6px">📉 ${esc(row.band_status)}</div>` : ""}
      ${(row.warnings || []).map((w) => `<div class="small" style="color:var(--warn)">! ${esc(w)}</div>`).join("")}
      ${ph ? "" : `<div class="small muted" style="margin-top:6px">LOC 주문은 걸면 주문가능금액이 묶입니다 → 주 매수 줄만 지금 걸고(≤ 1회 매수금), 1주씩 하락 대비 줄은 현재가가 기준 안으로 오면 '마감 전 걸기', 아니면 '마감 전 확인'(급락하면 텔레그램 알림). LOC 는 종가로 체결.</div>`}</section>`;
  if (r.cash != null && Number(r.short || 0) > 0)
    out += `<div class="card warn-note"><div class="small">⚠ ${esc(ACC_NAME[cur] || cur)} 전체 주문가능 <b class="num">$${money(r.cash)}</b> (원화 통합증거금 포함) — 이 계좌 무한매수 전략들의 지금 걸 매수에 <b class="num">$${money(r.short)}</b> 모자랍니다</div></div>`;
  out += confirmPanel(cur, r, g);
  return out;
}

// ── manual = manual (ADR 0043, 작업 ㉔ D 이름): 관리자가 줄을 골라 '주문' → 업로드 암호로 잠가 노트북에 보냄 → 노트북이 다시 계산과 맞춰 본 뒤 메리츠에 냄 ──
function cfChecked(k, def) { const m = S.cfSel || {}; return k in m ? m[k] : def; }
function confirmOn(acc) { return !!(S.snap && S.snap.summary.confirm_orders && S.admin && owner() === S.user.id && acc && acc.api); }
function confirmPanel(cur, r, g) {
  const acc = (S.snap.summary.accounts || {})[cur];
  if (!confirmOn(acc) || !r || !r.strategies) return "";
  const P = S.confirmPlan && S.confirmPlan.acc === cur ? S.confirmPlan : null;
  let saved = ""; try { saved = localStorage.getItem("upPass:" + owner()) || ""; } catch (e) {}
  const locNo = acceptNote("LOC");
  if (!P) return `<div class="card"><div class="row between"><h2>manual</h2><span class="small muted">체크한 줄만 노트북이 메리츠에 주문합니다</span></div>
    <div class="small muted">기본 체크 = 지금 걸 주 매수·매도. 하락 대비·보충 줄('더 보기' 안 포함)은 필요할 때 체크, 거부 예상 줄은 주문할 수 없습니다.</div>
    ${locNo ? `<div class="small warn-t">⏰ ${esc(locNo)}</div>` : ""}
    ${(r.strategies || []).some((x) => x.auto_now) ? `<div class="small warn-t">⚠ auto 켜진 전략은 메리츠 앱에서 따로 넣지 마세요 — 'auto 가 냄' 줄은 고를 수 없습니다 (auto 를 끄면 바로 manual 가능)</div>` : ""}
    ${S.cfNote && S.cfNote.acc === cur ? `<div class="small" style="color:var(--bad)" role="alert">${esc(S.cfNote.text)}</div>` : ""}
    <div class="row"><button class="btn primary" data-confirm-review="${esc(cur)}">확인</button></div></div>`;   // 작업 ㉔ D: 시험 주문 버튼 없앰 (ADR 0022 ① 끝남)
  const buy = (P.lines || []).filter((x) => x.side === "BUY").reduce((a, x) => a + (Number(x.price) || Number(((S.snap.summary.quotes || {})[g && g.symbol] || {}).price || 0)) * x.qty, 0);
  const cash = r.cash != null ? Number(r.cash) : null;
  const timeNo = [...new Set((P.test ? ["LOC"] : (P.lines || []).map((x) => x.kind)))].map((k) => acceptNote(k)).filter(Boolean)[0] || "";
  return `<div class="card warn-note"><h2>정말 주문할까요? — 메리츠에 주문합니다</h2>
    ${timeNo ? `<div class="small warn-t">⏰ ${esc(timeNo)} — 지금 보내면 노트북이 메리츠에 보내지 않고 돌려줍니다</div>` : ""}
    ${P.test ? `<div>시험 주문: <b>SOXL LOC 매수 1주</b> @ 현재가 −25% (노트북이 그 순간 시세로 계산)</div>`
      : `${P.lines.map((x) => `<div class="small"><span class="${sideCls(x.side)}">${sideKo(x.side)}</span> ${esc(sidName(x.sid))} ${esc(KIND_KO[x.kind] || x.kind)} <b class="num">${pxText(x.price)} × ${x.qty}</b></div>`).join("")}
         <div class="small">매수 합계 <b class="num">$${money(buy)}</b>${cash !== null ? ` · 주문가능 <b class="num">$${money(cash)}</b>${buy > cash ? ' <span class="chip bad">모자람 — 노트북이 넣지 않습니다</span>' : ""}` : ""}</div>`}
    <label>업로드 암호 (관리자만 아는 두 번째 열쇠)<input type="password" id="cf-pass" value="${esc(saved)}" autocomplete="off"></label>
    <div class="row"><button class="btn" data-confirm-cancel="1">취소</button><button class="btn danger" data-confirm-go="${esc(cur)}" ${timeNo ? "disabled" : ""}>주문</button></div>
    <div class="small muted">노트북이 지금 시세·보유로 다시 계산한 줄과 같을 때만, 10분 안에, 한 번만 주문합니다. 결과는 '최근 보낸 명령'과 텔레그램으로 옵니다.</div></div>`;
}
async function sendOrders(P, pass) {
  if (!pass || pass.length < 12) { S.msg = { bad: true, text: "업로드 암호(12자 이상)를 넣어 주세요" }; render(); return; }
  const body = { account: P.acc, lines: P.test ? [] : P.lines, test_symbol: P.test ? "SOXL" : null, ts: new Date().toISOString(), by: S.name };
  const blob = await lockBytes(new TextEncoder().encode(JSON.stringify(body)), "orders", pass);
  const b = new Uint8Array(await blob.arrayBuffer()); let bin = ""; for (const x of b) bin += String.fromCharCode(x);
  S.confirmPlan = null;
  // 작업 ㉔ D: '최근 보낸 명령' 한 줄 요약(예 "8Buy_T20 LOC(장마감지정가) 3줄") — 줄 내용은 잠긴 채로, 요약만 보임
  const by = {}; (P.lines || []).forEach((x) => { const k = sidName(x.sid) + " " + (KIND_KO[x.kind] || x.kind); by[k] = (by[k] || 0) + 1; });
  const brief = Object.entries(by).map(([k, n]) => `${k} ${n}줄`).join(" · ");
  await send("place_orders", { account: P.acc, sealed: btoa(bin), n: P.test ? 1 : P.lines.length, brief: brief ? "manual · " + brief : "manual" });
}
function staleNote() {
  if (!S.snap) return "";
  const min = Math.round((Date.now() - new Date(S.snap.taken_at).getTime()) / 60000);
  const waiting = S.cmds.filter((c) => c.status === "pending").length;
  // 작업 ㉑: 엔진 담당 기기가 달라 노트북이 이 칸을 돌리지 않는 중 — 시간 대신 이유를 보여 줌 (넘겨받기는 관리자가 노트북에서)
  const hb = S.snap.summary && S.snap.summary.host_block;
  if (hb) return `<div class="msg bad">⛔ 엔진 담당 기기가 다릅니다 — 담당 '${esc(hb.host || "?")}', 지금 노트북 '${esc(hb.this || "?")}'. 그래서 이 칸의 현황 갱신·가투·주문 계산이 멈춰 있습니다 (마지막 정상 갱신은 이 알림 전).
    관리자가 옛 기기가 꺼진 것을 확인한 뒤 노트북에서 <span class="mono">autotrader ${hb.profile ? "--profile " + esc(hb.profile) + " " : ""}host --take-over</span> 를 실행하면 풀립니다.</div>`;
  if (min < 30 && !(waiting && min >= 2)) return "";
  const ago = min >= 120 ? Math.round(min / 60) + "시간" : min + "분";
  return `<div class="msg warn-note">노트북 마지막 갱신 ${ago} 전 — 꺼져 있거나 잠자기 중일 수 있습니다.${waiting ? ` 웹에서 보낸 명령 ${waiting}건은 노트북이 켜지면 반영됩니다.` : ""}</div>`;
}

function viewHome(snap, mine) {
  if (!snap) return `<div class="card"><div class="empty">노트북 승인 봇이 켜지면 몇 분 안에 현황이 올라옵니다.</div>
    ${mine ? `<div class="small muted">처음 쓰는 사용자라면 노트북에 내 칸(프로필)이 먼저 있어야 합니다. 노트북 관리자에게 이 로그인 이메일을 알려 주세요. 칸이 생기면 '설정' 탭에서 계좌와 전략을 직접 추가합니다.</div>` : ""}</div>`;
  const s = snap.summary, d = snap.detail || {};
  if (S.detail && mine) return viewStrategy(s, d, S.detail);
  const t = s.totals || {}, strat = allStrategies(s);
  const bn = brokerNow(s, d);                      // 작업 ㊹-D: 프리·정규·애프터장엔 보유 × 지금가 + 달러 예수금 (표시만)
  const tonight = Object.values(d.tonight || {}).flat();
  const signed = (x) => x === null || x === undefined ? "-" : (Number(x) > 0 ? "+" : Number(x) < 0 ? "−" : "") + "$" + money(Math.abs(Number(x)));
  const pnlCls = (x) => Number(x) > 0 ? "buy" : Number(x) < 0 ? "sell" : "";
  const kpis = [
    ...(s.broker ? [["평가금액 (메리츠)", lv("lv-pcval", () => { const b = brokerNow(S.snap.summary, S.snap.detail || {}); return `<span id="lv-pcval">$${money(b.value)}<small class="muted kpi-basis">${esc(b.basis)}</small></span>`; }), `${krw(bn.value) ? krw(bn.value) + " · " : ""}${brokerNote(s.broker)}`, ""]] : []),
    ...(s.broker ? [] : [["평가금액", "$" + money(t.value), "메리츠 연결 전 (보유 × 종가 + 잔금)", ""]]),
    ["평가손익", lv("lv-pceval", () => { const e = evalNow(S.snap.summary); return `<span id="lv-pceval" class="${pnlClass(e.v)}">${signedUsd(e.v)}</span>`; }), krw(t.eval_pnl) ? krw(t.eval_pnl) + " · 평단 기준" : "평단 있는 보유 기준", ""],
    ["실현손익", signed(t.realized), "프로그램 기록 이후 누적", pnlCls(t.realized)],
    ...(s.broker ? [["달러 예수금 (메리츠)", "$" + money(s.broker.usd), "계좌별 달러 예수금 합계", ""]] : []),
    tonightKpi(d, tonight),
  ];
  let out = "";
  if (s.halted) out += `<div class="card"><span class="chip bad">자동매매 정지</span><div>${esc(s.halted)}</div></div>`;
  const B = [];                                   // [키, 이름, html] — 사용자가 순서·숨김을 정한다 (제보 #6)
  // 작업 ㊴ (R-18): 위 → 아래 = 요약 숫자 5개 + 오늘 할 일 → 전략 카드 → 시세 → 자산(USD) 차트 (차트는 맨 아래, 낮게)
  const isPhone = layout() === "phone" && mine;
  if (!isPhone) B.push(["kpis", "요약 숫자", `<section class="kpis" aria-label="요약">${kpis.map(([l, v, sub, c]) => `<div class="card kpi"><span class="small muted">${l}</span>
      <b class="num ${c}">${v}</b><span class="muted kpi-sub" title="${esc(sub)}">${sub}</span></div>`).join("")}</section>`]);
  if (mine && !isPhone) B.push(["today", "오늘 할 일", todayCard(s, d, strat)]);   // 폰은 할 일이 있을 때만 주황 띠 한 줄 (작업 ㊹-C)
  if (!strat.length && mine) B.push(["empty", "계좌·전략 등록", `<div class="card"><h2>아직 등록한 계좌·전략이 없습니다</h2>
    <div class="small muted">메리츠 계좌와 따라갈 전략(무한매수 주문표·VR·V4.0)을 먼저 등록하세요. 계좌 API 키는 노트북 .env 에만 넣습니다.</div>
    <div class="row"><button class="btn primary" data-tab="addstrat">계좌·전략 등록하기</button></div></div>`]);
  if (isPhone) phoneHome(s, d, strat, B);          // 작업 ㊹-C: 폰 현황 = 평가금 → 할 일 띠 → 시세 두 칸 → 오늘 밤 주문 → 전략 → 수익률 그래프
  else B.push(["strategies", "전략별 현황", `<section class="cards" aria-label="전략별 현황">${strat.map((g) => strategyCard(s, g)).join("")}</section>`]);
  if (!isPhone) B.push(["market", "시세", marketStrip(s)]);
  B.push(["equity", "자산 추이", `<div class="card eqcard"><div class="row between">${isPhone ? "<h2>수익률</h2>" : "<h2>자산(USD)</h2>"}</div>${equityChart(d.equity || [])}</div>`]);

function resolveStatsData(s, d) {
  if (d && d.stats && d.stats.all) return d.stats;
  // 스냅샷에 아직 stats가 없는 구버전 호환용 클라이언트 계산 Fallback
  const fx = (s && s.fx && Number(s.fx.usdkrw) > 500) ? Number(s.fx.usdkrw) : 1350;
  const closes = (s && s.closes) || {};
  const strats = allStrategies(s || {}, false);
  let inv = 0, cash = 0, seed = 0, ev = 0, evPnl = 0;
  const srows = strats.map((g) => {
    const q = Number(g.qty || 0) + Number(g.excluded_qty || 0), avg = Number(g.avg || 0), c = Number(g.cash || 0);
    const px = closes[g.symbol] != null ? Number(closes[g.symbol]) : avg;
    const gi = q > 0 && avg > 0 ? q * avg : 0, ge = q * px + c, gp = q > 0 && avg > 0 ? (px - avg) * q : 0;
    const gs = gi + c;
    inv += gi; cash += c; seed += gs; ev += ge; evPnl += gp;
    const rz = Number(g.realized || 0);
    return {
      sid: g.id, name: stratName(g, ((s || {}).plans || {})[g.id]), account: g.account,
      account_label: ACC_NAME[g.account] || g.account, symbol: g.symbol, qty: q, avg, close: px,
      seed_usd: gs, invested_usd: gi, cash_usd: c, exhaustion_pct: gs > 0 ? (gi / gs) * 100 : 0,
      eval_usd: ge, eval_pnl_usd: gp, eval_pnl_pct: gi > 0 ? (gp / gi) * 100 : 0,
      net_pnl_usd: rz, profit_usd: rz > 0 ? rz : 0, profit_count: rz > 0 ? 1 : 0,
      loss_usd: rz < 0 ? rz : 0, loss_count: rz < 0 ? 1 : 0, return_pct: gi > 0 ? (rz / gi) * 100 : 0,
      month_net_usd: rz, month_profit_usd: rz > 0 ? rz : 0, month_loss_usd: rz < 0 ? rz : 0,
    };
  });
  const emptyP = (lbl) => ({ label: lbl, range: "", net_usd: 0, profit_usd: 0, profit_count: 0, loss_usd: 0, loss_count: 0, return_pct: 0, win_rate_pct: 0 });
  const scope = {
    capital: {
      total_seed_usd: seed, invested_usd: inv, available_cash_usd: cash,
      exhaustion_pct: seed > 0 ? (inv / seed) * 100 : 0, eval_usd: ev, eval_pnl_usd: evPnl,
      eval_pnl_pct: inv > 0 ? (evPnl / inv) * 100 : 0,

  return { usdkrw: fx, current_month: new Date().toISOString().slice(0, 7), accounts: [], all: scope, by_account: {} };
}

function statsKrw(usd, fx, signed = false) {
  const r = Number(fx) > 500 ? Number(fx) : ((S.snap && S.snap.summary && S.snap.summary.fx && Number(S.snap.summary.fx.usdkrw)) || 1350);
  if (usd === null || usd === undefined || isNaN(Number(usd))) return "-";
  const v = Math.round(Number(usd) * r), a = Math.abs(v);
  const sg = v < 0 ? "−" : (signed && v > 0 ? "+" : "");
  if (a === 0) return "₩0";
  if (a >= 1e8) return `${sg}₩${(a / 1e8).toFixed(2)}억 (약 ${sg}${Math.round(a / 1e4).toLocaleString("ko-KR")}만원)`;
  if (a >= 1e4) return `약 ${sg}${Math.round(a / 1e4).toLocaleString("ko-KR")}만원`;
  return `${sg}₩${a.toLocaleString("ko-KR")}`;
}

function statsUsdSigned(x) {

function statsPctSigned(x) {

// ── 작업 58 (11/21 사용자): PC 통계 화면 — 한 줄 숫자 → 자산 추이 → 달력 · 월별 비교 → 운용 상태 → 위험 지표 → 전략별 성과표.
//   표시만. 값은 스냅숏(summary · detail.stats · detail.equity) + 지금가(㊹-D nowPx)로 화면에서 셈 — 주문 계산·stats.py 그대로
const ST_LINES = [["ev", "평가금", "var(--accent)"], ["prin", "투자원금 (메리츠 총 매입금액)", "var(--muted)"], ["cum", "누적 확정손익", "var(--ice)"]];
function stAccOf(st) { return (S.statsAcc && S.statsAcc !== "all" && (st.by_account || {})[S.statsAcc]) ? S.statsAcc : "all"; }
function stStrats(s, acc) {
  return allStrategies(s).filter((g) => acc === "all" || g.account === acc)
    .sort((a, b) => stratRank(stratName(a, (s.plans || {})[a.id])) - stratRank(stratName(b, (s.plans || {})[b.id])));
}
// 하루 기록(equity.json, 종가 기준) → 범위(전체 = 메리츠 평가금, 계좌 = 그 계좌) [{date, ev, prin, cum}]
//   prin = 그 범위 전략 원금 합(그날 기록 → 없으면 지금 원금, 원금 없는 전략은 뺌), cum = 달력 확정손익을 그날까지 더한 값
// 11/21 사용자: 투자원금 = 메리츠 앱 계좌의 '총 매입금액' — 노트북이 매일 10:00 받는 메리츠 잔고(보유 × 평균가) 합 (detail.meritz_cost).
//   그 기록이 없을 때만 예전처럼 전략 원금 합.
function costAt(hist, day) {
  let best = null, v = null;
  for (const [k, x] of Object.entries(hist || {})) if (k <= day && (best === null || k > best)) { best = k; v = Number(x); }
  return best === null || !isFinite(v) ? null : v;
}
function stEquityRows(s, d, scope, acc) {
  const rows = d.equity || [], P = prinNow(s), ids = stStrats(s, acc).map((g) => g.id);
  const mc = d.meritz_cost || {}, mcAccs = Object.keys(mc).filter((a) => acc === "all" || a === acc), useMc = mcAccs.length > 0;
  const cal = Object.values((scope || {}).calendar || {}).map((c) => [String(c.date), Number(c.net_usd || 0)]).sort((a, b) => a[0] < b[0] ? -1 : 1);
  let ci = 0, cum = 0;
  const ok = (v) => v !== null && v !== undefined && v !== "" && isFinite(Number(v));
  return rows.map((r) => {
    while (ci < cal.length && cal[ci][0] <= String(r.date)) cum += cal[ci++][1];
    const ev = acc === "all" ? (ok(r.broker) ? Number(r.broker) : ok(r.value) ? Number(r.value) : null) : ok((r.acc || {})[acc]) ? Number(r.acc[acc]) : null;
    let p = 0, pn = 0;
    if (useMc) {                                        // 메리츠 총 매입금액 (그날까지 가장 최근 잔고 기준점)
      for (const a of mcAccs) { const v = costAt(mc[a], String(r.date)); if (v != null) { p += v; pn++; } }
    } else for (const k of ids) {
      const pd = (r.prin || {})[k], has = ok(pd) || ok((r.strat || {})[k]);
      const v = ok(pd) ? Number(pd) : Number(P[k] || 0);
      if (has && v > 0) { p += v; pn++; }
    }
    return { date: String(r.date), ev, prin: pn ? Math.round(p * 100) / 100 : null, cum: Math.round(cum * 100) / 100 };
  });
}
// 낙폭: 지금까지 최고 평가금 대비. now 가 있으면(지금가 평가금) 맨 끝 점으로 더함
function stDrawdown(rows, now) {
  const pts = rows.filter((r) => r.ev != null && r.ev > 0).map((r) => [r.date, r.ev]);
  if (now != null && now > 0) pts.push(["now", now]);
  let peak = 0, peakDate = "", mdd = 0, mddDate = "", cur = null;
  for (const [dt, v] of pts) {
    if (v > peak) { peak = v; peakDate = dt; }
    const dd = (v / peak - 1) * 100;
    if (dd < mdd) { mdd = dd; mddDate = dt; }
    cur = dd;
  }
  return { mdd, mddDate, cur, peak, peakDate, n: pts.length };
}
// 범위 평가금 (메리츠): 장중 = 보유 × 지금가 + 달러 예수금, 그 밖 = 직전 종가 기준 (㊹-D 와 같은 함수)
function stValueNow(s, d, acc) {
  const bk = s.broker;

      if (dup(f.rules) || dup(f.stops)) { S.msg = { bad: true, text: "같은 하락% 단계가 두 개 있습니다 — 다이얼을 다르게 맞춰 주세요" }; render(); return; }
      Object.assign(p, { rules: ser(f.rules), stops: ser(f.stops), tp: String(f.tp), tp_sell: String(f.tpSell) });
      if (!f.stops.length) p.stops = "";
    }
    const ss = S.sessSel.add, serr = ss ? sessCheck(ss.sel, ss.fam) : "";       // 운용 장 (ADR 0053)
    if (serr) { S.msg = { bad: true, text: serr }; render(); return; }
    if (ss) p.sessions = sessClean(ss.sel);
    send("add_strategy", p); };
  const fg = document.getElementById("f-grant");
  if (fg) fg.onsubmit = async (e) => { e.preventDefault();
    const rel = document.getElementById("g-rel").value;
    const r = await sb.rpc("grant_access", { p_viewer_email: document.getElementById("g-email").value.trim(), p_level: "detail",
      p_relation: rel, p_days: rel === "family" ? null : 30 });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "추가했습니다. 상대가 '볼 수 있는 사람'에서 봅니다." };
    await loadFamily(); render(); };
  const fr = document.getElementById("f-req");
  if (fr) fr.onsubmit = async (e) => { e.preventDefault();
    const r = await sb.rpc("request_access", { p_owner_email: document.getElementById("r-email").value.trim(), p_level: "summary",
      p_note: document.getElementById("r-note").value.trim() || null });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "요청했습니다. 상대가 허락하면 '볼 수 있는 사람'에 나옵니다." };
    await loadFamily(); render(); };
  document.querySelectorAll("[data-decide]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("decide_access", { p_grant_id: Number(b.dataset.decide), p_approve: b.dataset.ok === "1", p_days: 30, p_level: null });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: b.dataset.ok === "1" ? "30일 동안 요약을 볼 수 있게 했습니다." : "거절했습니다." };
    await loadFamily(); render(); });
  document.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = async () => {
    const r = await sb.rpc("revoke_access", { p_viewer_email: b.dataset.revoke });
    S.msg = r.error ? { bad: true, text: ko(r.error.message) } : { text: "회수했습니다." };
    await loadFamily(); render(); });
}

// ── 시작 ──
// 11/07: '불러오는 중'에서 멈추지 않게 — 응답이 늦으면 시간 제한 + 안내 + 다시 시도
const withTimeout = (pr, ms, what) => Promise.race([pr, new Promise((_, bad) => setTimeout(() => bad(new Error(what + " 응답이 " + Math.round(ms / 1000) + "초 넘게 없음")), ms))]);
function loadingStuck(reason) {
  const el = document.getElementById("loading"); if (!el) return;
  el.innerHTML = `<div><b>불러오기가 오래 걸립니다</b></div>
    <div class="small muted">${esc(reason || "서버(Supabase) 응답을 기다리는 중")}${S.stage ? " · 단계: " + esc(S.stage) : ""}${S.jsErrors.length ? "<br>오류: " + esc(S.jsErrors.join(" / ")) : ""}</div>
    <div class="small muted">인터넷 연결을 확인하고 다시 시도해 주세요. 계속되면 이 화면을 Claude 에게 보내 주세요.</div>
    <div class="row"><button class="btn primary" onclick="location.reload()">다시 시도</button></div>`;
}
setTimeout(() => loadingStuck(), 35000);
async function onSession(session) {
  try { await onSessionInner(session); }
  catch (e) { if (document.getElementById("loading")) loadingStuck(String(e.message || e)); else { S.msg = { bad: true, text: "불러오지 못했습니다: " + (e.message || e) }; render(); } }
}
async function onSessionInner(session) {
  S.user = session ? session.user : null;
  if (S.user) {
    S.stage = "회원 정보";
    const p = await withTimeout(sb.from("profiles").select("display_name,status,role").eq("user_id", S.user.id).limit(1), 12000, "회원 정보");
    const me = (p.data && p.data[0]) || {};
    S.name = me.display_name || S.user.email.split("@")[0];
    S.status = me.status || "approved";            // 회원 승인 기능 이전 데이터베이스면 승인으로 본다
    S.admin = me.role === "admin";
    if (S.status !== "approved") return renderPending();
    S.stage = "2단계 인증";
    await loadAal();
    if (S.aalNext === "aal2" && S.aal !== "aal2") return renderMfaChallenge();   // 인증 앱을 등록한 사람은 6자리 먼저 (ADR 0035)
    await withTimeout(loadFlags(), 8000, "설정").catch(() => {});
    await withTimeout(loadOps(), 8000, "공동 운영").catch(() => {});
    S.stage = "현황";
    await withTimeout(refresh(), 33000, "현황");
  } else render();
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") { S.recovery = true; S.user = session && session.user; return renderRecovery(); } if ((session && session.user.id) !== (S.user && S.user.id)) onSession(session); });
S.stage = "로그인 확인";
withTimeout(sb.auth.getSession(), 10000, "로그인 확인").then(({ data }) => onSession(data.session)).catch((e) => {
  // 로그인 확인이 멈추면: 저장된 로그인 정보를 지우고 로그인 화면으로 (다시 로그인하면 됨)
  try { Object.keys(localStorage).filter((k) => k.startsWith("sb-") && k.endsWith("-auth-token")).forEach((k) => localStorage.removeItem(k)); } catch (x) {}
  S.user = null; S.msg = { bad: true, text: "로그인 확인이 멈춰 저장된 로그인을 지웠습니다 — 다시 로그인해 주세요 (" + (e.message || e) + ")" }; render();
});
setInterval(() => { if (document.visibilityState === "visible") refresh(true); }, 30000);
// 실시간 시세: 화면을 보고 있고 장 시간이면 5초마다 가져와 시세 줄만 바꾼다 (화면 전체를 다시 그리지 않음).
// 30초마다 '보고 있음'을 알려야 관리자 노트북이 5초 시세를 올린다 (아무도 안 보면 메리츠를 부르지 않음).
let liveTouched = 0;
setInterval(async () => {
  if (document.visibilityState !== "visible" || !S.user || !S.snap || S.status !== "approved") return;
  const m = S.snap.summary.market; if (m && m.code === "closed") return;
  if (!["home", "confirm", "mockstat"].includes(S.tab)) return;         // 작업 ㊹: 주문 화면도 (LOC 체결 예상)
  try {
    if (Date.now() - liveTouched > 30000) { liveTouched = Date.now(); await sb.rpc("touch_live"); }
    const r = await sb.from("live_quotes").select("quotes,at").eq("id", "global").limit(1);
    const row = r.data && r.data[0]; if (!row || !row.at || (S.live && S.live.at === row.at)) return;
    S.livePrev = S.live ? S.live.quotes : null; S.live = row;
    const el = document.getElementById("mkt"); if (el) el.outerHTML = el.dataset.v === "ph" ? phQuotes(S.snap.summary) : marketStrip(S.snap.summary);
    liveTick();                                     // 작업 ㊹: 평가금 지금가·전략 지금 손익·LOC 예상·낙폭 단계 남은 %
  } catch (e) {}
}, 5000);
let _lastMode = null;
let _lastAutoPhone = null;   // 작업 ㉟: 폭이 768 을 넘나들면(회전 등) auto 화면을 다시 그림
window.addEventListener("resize", () => { const m = layout(), ap = autoPhone(); if (m !== _lastMode || ap !== _lastAutoPhone) { _lastMode = m; _lastAutoPhone = ap; if (S.user) render(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(true); });
</script>
